<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 管理员登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;position:relative}
.bg-grid{position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
.container{width:100%;max-width:340px;margin:0 auto;position:relative;z-index:1;padding:20px 0}
.icon,.icon-white{width:16px;height:16px;display:inline-block;vertical-align:middle;flex-shrink:0}
.icon{filter:brightness(0)saturate(100%)}
.icon-white{filter:brightness(0)invert(1)}
.icon-lg{width:44px;height:44px;display:block;margin:0 auto 6px;filter:brightness(0)saturate(100%)}
.spinner{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.title-section{text-align:center;margin-bottom:18px}
.title-section .title-text{font-size:20px;font-weight:700;color:#0a0a0a;letter-spacing:.5px}
.form-group{margin-bottom:10px}
.input-wrapper{display:flex;align-items:center;background:#f5f5f7;border:1px solid #e5e5ea;border-radius:8px;transition:all .3s ease;padding:0 12px;height:42px}
.input-wrapper:focus-within{border-color:#0a0a0a;background:#f0f0f2}
.input-wrapper .icon{margin-right:8px;opacity:.4}
.input-wrapper input{flex:1;padding:8px 0;background:transparent;border:none;color:#0a0a0a;font-size:14px;outline:none;min-width:0}
.input-wrapper input::placeholder{color:#999;font-size:13px}
.btn{width:100%;height:36px;min-height:36px;line-height:36px;padding:0 10px;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .3s ease;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.btn:hover{background:#222}
.btn:disabled{background:#555;color:#fff;cursor:not-allowed}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
<div class="title-section"><img src="/svg/admin.svg" class="icon-lg"><div class="title-text">管理员登录</div></div>
<div class="form-group"><div class="input-wrapper"><img src="/svg/user.svg" class="icon"><input type="text" id="adminUsername" placeholder="请输入管理员账号" autocomplete="username"></div></div>
<div class="form-group"><div class="input-wrapper"><img src="/svg/lock.svg" class="icon"><input type="password" id="adminPassword" placeholder="请输入管理员密码" autocomplete="current-password"></div></div>
<button class="btn" id="adminLoginBtn"><img src="/svg/enter.svg" class="icon-white"> 登录后台</button>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){const u=document.getElementById('adminUsername'),p=document.getElementById('adminPassword'),b=document.getElementById('adminLoginBtn');(function(){const s=localStorage.getItem('admin_credentials');if(s)try{const c=JSON.parse(s);if(c.username)u.value=c.username;if(c.password)p.value=c.password}catch(e){}})();b.addEventListener('click',async function(){const un=u.value.trim(),pw=p.value.trim();if(!un||!pw){toast.error('请填写账号和密码');return}b.disabled=true;b.innerHTML='<img src="/svg/loading.svg" class="icon-white spinner"> 登录中...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:un,password:pw})}),d=await r.json();if(d.success){localStorage.setItem('admin_credentials',JSON.stringify({username:un,password:pw}));toast.success('登录成功!');setTimeout(()=>{window.location.href='/admin/dashboard'},600)}else{toast.error(d.error||'登录失败');b.disabled=false;b.innerHTML='<img src="/svg/enter.svg" class="icon-white"> 登录后台'}}catch(e){toast.error('网络错误');b.disabled=false;b.innerHTML='<img src="/svg/enter.svg" class="icon-white"> 登录后台'}});p.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()})}();
</script>
</body>
</html>
