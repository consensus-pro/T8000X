<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 管理员登录</title>
<style>
*{m:0;p:0;bx:border-box;f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{bg:#fff;df:flex;jc:center;ai:center;mh:100vh;p:20px;pos:relative}
.bg{pos:fixed;t:0;l:0;r:0;b:0;bg-img:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);bg-size:50px 50px;pe:none;z:0}
.c{width:100%;max-width:340px;margin:0 auto;pos:relative;z:1;p:20px 0}
.i,.iw{width:16px;height:16px;d:inline-block;va:middle;fs:0}
.i{filter:brightness(0)saturate(100%)}
.iw{filter:brightness(0)invert(1)}
.il{width:44px;height:44px;d:block;margin:0 auto 6px;filter:brightness(0)saturate(100%)}
.sp{animation:spn 1s linear infinite;d:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ts{text-align:center;mb:18px}
.tt{font-size:20px;fw:700;color:#0a0a0a;ls:.5px}
.fg{mb:10px}
.iwr{df:flex;ai:center;bg:#f5f5f7;bd:1px solid #e5e5ea;br:8px;transition:all .3s ease;p:0 12px;h:42px}
.iwr:focus-within{bd-color:#0a0a0a;bg:#f0f0f2}
.iwr .i{mr:8px;op:.4}
.iwr input{flex:1;p:8px 0;bg:transparent;bd:none;color:#0a0a0a;font-size:14px;outline:none;min-width:0}
.iwr input::placeholder{color:#999;font-size:13px}
.bt{width:100%;h:36px;min-height:36px;line-height:36px;p:0 10px;bg:#0a0a0a;color:#fff;bd:none;br:8px;font-size:13px;fw:600;cursor:pointer;transition:background .3s ease;df:flex;ai:center;jc:center;gap:6px;mt:6px}
.bt:hover{bg:#222}
.bt:disabled{bg:#555;color:#fff;cursor:not-allowed}
</style>
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="ts"><img src="/svg/admin.svg" class="il"><div class="tt">管理员登录</div></div>
<div class="fg"><div class="iwr"><img src="/svg/user.svg" class="i"><input type="text" id="adminUsername" placeholder="请输入管理员账号" autocomplete="username"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/lock.svg" class="i"><input type="password" id="adminPassword" placeholder="请输入管理员密码" autocomplete="current-password"></div></div>
<button class="bt" id="adminLoginBtn"><img src="/svg/enter.svg" class="iw"> 登录后台</button>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){const u=document.getElementById('adminUsername'),p=document.getElementById('adminPassword'),b=document.getElementById('adminLoginBtn');(function(){const s=localStorage.getItem('admin_credentials');if(s)try{const c=JSON.parse(s);if(c.username)u.value=c.username;if(c.password)p.value=c.password}catch(e){}})();b.addEventListener('click',async function(){const un=u.value.trim(),pw=p.value.trim();if(!un||!pw){toast.error('请填写账号和密码');return}b.disabled=true;b.innerHTML='<img src="/svg/loading.svg" class="iw sp"> 登录中...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:un,password:pw})}),d=await r.json();if(d.success){localStorage.setItem('admin_credentials',JSON.stringify({username:un,password:pw}));toast.success('登录成功!');setTimeout(()=>{window.location.href='/admin/dashboard'},600)}else{toast.error(d.error||'登录失败');b.disabled=false;b.innerHTML='<img src="/svg/enter.svg" class="iw"> 登录后台'}}catch(e){toast.error('网络错误');b.disabled=false;b.innerHTML='<img src="/svg/enter.svg" class="iw"> 登录后台'}});p.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()})}();
</script>
</body>
</html>
