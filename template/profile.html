<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 账号设置</title>
<link rel="stylesheet" href="/template/style.css">
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="as">
<div id="ac" class="da"><img src="/svg/avatar.svg"></div>
</div>
<div class="ti"><img src="/svg/user.svg" class="i"> 账号设置</div>
<div class="sb" id="statsBox">
<div class="si"><div class="nu" id="rankDisplay">--</div><div class="lb"><img src="/svg/ranking.svg" class="is">排名</div></div>
<div class="si"><div class="nu" id="pointsDisplay">0</div><div class="lb"><img src="/svg/coins.svg" class="is">积分</div></div>
</div>
<div class="ib">
<p><img src="/svg/user.svg" class="i">账号:<span id="profileUsername">––</span></p>
<p class="sr"><span><img src="/svg/sign.svg" class="i"> 签名:<span class="st2" id="profileSignature">––</span></span><button class="sb2" id="editSignatureBtn">修改</button></p>
<p class="gr"><span><img src="/svg/gender.svg" class="i"> 性别:<span class="gt2" id="profileGender">––</span></span><button class="gb" id="editGenderBtn">修改</button></p>
<p><img src="/svg/email.svg" class="i">邮箱:<span id="profileEmail">––</span></p>
<p><img src="/svg/time.svg" class="i">注册时间:<span id="profileCreatedAt">––</span></p>
<p><img src="/svg/qq.svg" class="ig">绑定QQ:<span id="qqStatus">––</span><button class="qb" id="qqBindBtn">修改</button></p>
</div>
<div class="brc">
<button class="bt" id="checkinBtn"><img src="/svg/calendar.svg" class="is">签到</button>
<button class="bt" id="transferBtn"><img src="/svg/transfer.svg" class="is">转账</button>
<button class="bt" id="rankingBtn"><img src="/svg/ranking.svg" class="is">排行榜</button>
<button class="bt" id="announceBtn"><img src="/svg/net.svg" class="is">公告</button>
</div>
<div class="br">
<button class="bt" id="backBtn"><img src="/svg/return.svg" class="i"> 返回</button>
<button class="bt bd2" id="logoutBtn"><img src="/svg/exit.svg" class="i"> 退出登录</button>
</div>
</div>
<div class="mo" id="qqModal"><div class="md"><h3><img src="/svg/qq.svg" class="i"> 绑定QQ</h3><div class="ib3"><input type="text" id="qqInput" placeholder="请输入QQ号" maxlength="11"></div><div class="brw"><button class="bt bv" id="qqModalCancel">取消</button><button class="bt bc" id="qqModalConfirm">确认绑定</button></div></div></div>
<div class="mo" id="signatureModal"><div class="md"><h3><img src="/svg/sign.svg" class="i"> 修改签名</h3><div class="ib3"><textarea id="signatureInput" placeholder="请输入签名（1-20个字）" maxlength="20" rows="2"></textarea><div class="cc"><span id="charCount">0</span>/20</div></div><div class="brw"><button class="bt bv" id="signatureModalCancel">取消</button><button class="bt bc" id="signatureModalConfirm">确认修改</button></div></div></div>
<div class="mo" id="genderModal"><div class="md"><h3><img src="/svg/gender.svg" class="i"> 修改性别</h3><div class="fs2"><div class="fh2" id="genderFoldHeader"><span><img src="/svg/gender.svg" class="i"> 选择性别</span><span id="genderFoldArrow"><img src="/svg/switch.svg" class="i gsi"></span></div><div class="fb2" id="genderFoldBody"><div class="go" id="genderOptions"><div class="go2" data-value="男">男</div><div class="go2" data-value="女">女</div><div class="go2" data-value="其他">其他</div><div class="go2" data-value="不愿透露">不愿透露</div></div></div></div><div class="brw"><button class="bt bv" id="genderModalCancel">取消</button><button class="bt bc" id="genderModalConfirm">确认修改</button></div></div></div>
<div class="mo rm" id="rankingModal"><div class="md mw"><h3><img src="/svg/ranking.svg" class="i"> 排行榜</h3><div class="rl" id="rankingList"></div><button class="cb3" id="rankingCloseBtn"><img src="/svg/return.svg" class="i"> 关闭</button></div></div>
<div class="mo am2" id="announceModal"><div class="md mw"><h3><img src="/svg/net.svg" class="ib2"> 公告</h3><div class="acn" id="announceContent"></div><button class="cb3" id="announceCloseBtn"><img src="/svg/return.svg" class="i"> 关闭</button></div></div>
<div class="mo" id="transferModal"><div class="md"><h3><img src="/svg/transfer.svg" class="i"> 转账</h3><div class="ib3"><input type="text" id="transferTarget" placeholder="目标用户名"></div><div class="ib3"><input type="number" id="transferPoints" placeholder="积分" min="1" step="1"></div><div class="brw"><button class="bt bv" id="transferCancel">取消</button><button class="bt bc" id="transferConfirm">确定</button></div></div></div>
<template id="tpl-loading"><div class="ls2"><img src="/svg/loading.svg" class="i sp">加载中...</div></template>
<template id="tpl-no-data"><div class="no-data">暂无数据</div></template>
<template id="tpl-no-announcement"><div class="no-data">暂无公告</div></template>
<template id="tpl-load-failed"><div class="no-data">加载失败</div></template>
<template id="tpl-announcement"><div><div class="at2" data-field="title"></div><div class="ab2" data-field="content"></div></div></template>
<template id="tpl-ranking-item"><div class="ri"><span class="rn" data-field="rank"></span><div class="ra" data-field="avatar" data-username=""><img data-field="avatar-img" src=""></div><div class="ri2"><span class="rn2" data-field="username"></span><span class="rs"><span><img src="/svg/calendar.svg" class="is"> <span data-field="days"></span></span><span><img src="/svg/coins.svg" class="is"> <span data-field="points"></span></span></span></div></div></template>
<script src="/api/toast.js"></script>
<script>
"use strict";
async function apiCall(url,method,body){try{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const res=await fetch(url,opts);return await res.json()}catch(e){return{success:false,error:'网络连接失败，请重试'}}}
function cloneTemplate(id){const tpl=document.getElementById(id);return tpl.content.cloneNode(true);}
function fillText(el,selector,text){const target=el.querySelector(selector);if(target)target.textContent=text;}
function setAttr(el,selector,attr,value){const target=el.querySelector(selector);if(target)target.setAttribute(attr,value);}
const $=id=>document.getElementById(id);
const ue=$('profileUsername'),ee=$('profileEmail'),se=$('profileSignature'),ge=$('profileGender'),ce=$('profileCreatedAt'),ac=$('ac'),qs=$('qqStatus'),rd=$('rankDisplay'),pd=$('pointsDisplay'),qb=$('qqBindBtn'),lo=$('logoutBtn'),bb=$('backBtn'),esb=$('editSignatureBtn'),egb=$('editGenderBtn'),cb=$('checkinBtn'),rb=$('rankingBtn'),ab=$('announceBtn'),tb=$('transferBtn'),qm=$('qqModal'),qi=$('qqInput'),qmc=$('qqModalConfirm'),qmc2=$('qqModalCancel'),sm=$('signatureModal'),si=$('signatureInput'),cc=$('charCount'),smc=$('signatureModalConfirm'),smc2=$('signatureModalCancel'),gm=$('genderModal'),go=$('genderOptions'),gmc=$('genderModalConfirm'),gmc2=$('genderModalCancel'),gfh=$('genderFoldHeader'),gfb=$('genderFoldBody'),gfa=$('genderFoldArrow'),rm=$('rankingModal'),rl=$('rankingList'),rcb=$('rankingCloseBtn'),am2=$('announceModal'),acn=$('announceContent'),acb=$('announceCloseBtn'),tm=$('transferModal'),tt=$('transferTarget'),tp=$('transferPoints'),tc=$('transferCancel'),tc2=$('transferConfirm');
let cq='',cs='',cg='',sg='',fo=false;
function getGenderColor(g){if(g==='男')return '#1677ff';if(g==='女')return '#ff69b4';if(g==='其他')return '#ffc107';return '#888';}
function updateAvatar(qq,gender){const color=getGenderColor(gender);ac.style.borderColor=color;ac.classList.remove('da','qa');ac.style.backgroundImage='';ac.style.backgroundColor='';ac.innerHTML='';if(qq){ac.classList.add('qa');ac.style.backgroundImage='url(https://q1.qlogo.cn/g?b=qq&nk='+qq+'&s=640)';ac.style.backgroundSize='cover';ac.innerHTML='<img src="/svg/avatar.svg" style="display:none;">';}else{ac.classList.add('da');ac.innerHTML='<img src="/svg/avatar.svg">';}}
function updateSignature(text){se.textContent=text;if(text==='未填写')se.classList.add('gt');else se.classList.remove('gt');}
function updateGender(text){ge.textContent=text;if(text==='不愿透露')ge.classList.add('gt');else ge.classList.remove('gt');}
function updateRank(rank,points){rd.textContent=(points>0&&rank)?'#'+rank:'未上榜';}
async function loadProfile(){const r=await apiCall('/api/user','GET');if(r.success){ue.textContent=r.username;ee.textContent=r.email;cs=r.signature||'未填写';updateSignature(cs);cg=r.gender||'不愿透露';updateGender(cg);ce.textContent=r.created_at||'未知';cq=r.qq_number||'';pd.textContent=r.total_points||0;updateRank(r.rank,r.total_points);if(cq){qs.textContent=cq;qs.className='qq-status';}else{qs.textContent='未绑定';qs.className='qq-status unbind';}updateAvatar(cq,cg);toast.success('账号数据已加载');}else{window.location.href='/login';}}
function renderLoading(container){container.innerHTML='';const clone=cloneTemplate('tpl-loading');container.appendChild(clone);}
function renderNoData(container){container.innerHTML='';const clone=cloneTemplate('tpl-no-data');container.appendChild(clone);}
function renderNoAnnouncement(container){container.innerHTML='';const clone=cloneTemplate('tpl-no-announcement');container.appendChild(clone);}
function renderLoadFailed(container){container.innerHTML='';const clone=cloneTemplate('tpl-load-failed');container.appendChild(clone);}
function renderAnnouncement(container,title,content){container.innerHTML='';const clone=cloneTemplate('tpl-announcement');fillText(clone,'[data-field="title"]',title||'公告');fillText(clone,'[data-field="content"]',content||'');container.appendChild(clone);}
function renderRankingItem(item){const clone=cloneTemplate('tpl-ranking-item');const rankEl=clone.querySelector('[data-field="rank"]');if(rankEl)rankEl.textContent='#'+item.rank;const avatarEl=clone.querySelector('[data-field="avatar"]');if(avatarEl)avatarEl.dataset.username=item.username;const imgEl=clone.querySelector('[data-field="avatar-img"]');if(imgEl){imgEl.src=item.avatar_url||'/svg/avatar.svg';}fillText(clone,'[data-field="username"]',item.username);fillText(clone,'[data-field="days"]',item.checkin_days);fillText(clone,'[data-field="points"]',item.total_points);return clone;}
function renderRankingList(container,items){container.innerHTML='';if(!items||items.length===0){const clone=cloneTemplate('tpl-no-data');container.appendChild(clone);return;}items.forEach(item=>{const el=renderRankingItem(item);container.appendChild(el);});container.querySelectorAll('[data-field="avatar"]').forEach(el=>{el.addEventListener('click',function(e){e.stopPropagation();const username=this.dataset.username;if(username)window.location.href='/user?id='+username;});});}
si.addEventListener('input',function(){cc.textContent=this.value.length;});
esb.addEventListener('click',()=>{si.value=(cs==='未填写')?'':cs;cc.textContent=si.value.length;sm.classList.add('ac');});
smc2.addEventListener('click',()=>sm.classList.remove('ac'));
smc.addEventListener('click',async()=>{let s=si.value.trim();if(!s)s='未填写';const r=await apiCall('/api/update-signature','POST',{signature:s});if(r.success){toast.success(r.message);cs=r.signature;updateSignature(cs);sm.classList.remove('ac');}else{toast.error(r.error||'修改失败');}});
sm.addEventListener('click',(e)=>{if(e.target===sm)sm.classList.remove('ac');});
gfh.addEventListener('click',()=>{fo=!fo;gfb.classList.toggle('op');const icon=gfa.querySelector('.gsi');if(icon)icon.classList.toggle('op');});
go.addEventListener('click',(e)=>{const o=e.target.closest('.go2');if(!o)return;document.querySelectorAll('.go2').forEach(el=>el.classList.remove('sel'));o.classList.add('sel');sg=o.dataset.value;});
egb.addEventListener('click',()=>{fo=false;gfb.classList.remove('op');const icon=gfa.querySelector('.gsi');if(icon)icon.classList.remove('op');document.querySelectorAll('.go2').forEach(el=>el.classList.remove('sel'));let found=false;document.querySelectorAll('.go2').forEach(el=>{if(el.dataset.value===cg){el.classList.add('sel');sg=cg;found=true;}});if(!found){const def=document.querySelector('.go2[data-value="不愿透露"]');if(def){def.classList.add('sel');sg='不愿透露';}}gm.classList.add('ac');});
gmc2.addEventListener('click',()=>gm.classList.remove('ac'));
gmc.addEventListener('click',async()=>{const sel=document.querySelector('.go2.sel');if(!sel){toast.error('请先展开并选择性别');return;}const g=sel.dataset.value;const r=await apiCall('/api/update-gender','POST',{gender:g});if(r.success){toast.success(r.message);cg=r.gender;updateGender(cg);updateAvatar(cq,cg);gm.classList.remove('ac');}else{toast.error(r.error||'修改失败');}});
gm.addEventListener('click',(e)=>{if(e.target===gm)gm.classList.remove('ac');});
qb.addEventListener('click',()=>{qi.value=cq;qm.classList.add('ac');});
qmc2.addEventListener('click',()=>qm.classList.remove('ac'));
qmc.addEventListener('click',async()=>{const q=qi.value.trim();if(!q){toast.error('请输入QQ号');return;}if(!/^\d{5,11}$/.test(q)){toast.error('请输入正确的QQ号');return;}const r=await apiCall('/api/bind-qq','POST',{qq_number:q});if(r.success){toast.success(r.message);qm.classList.remove('ac');loadProfile();}else{toast.error(r.error||'绑定失败');}});
qm.addEventListener('click',(e)=>{if(e.target===qm)qm.classList.remove('ac');});
cb.addEventListener('click',async()=>{cb.disabled=true;cb.innerHTML='<img src="/svg/loading.svg" class="is sp"> 签到中...';const r=await apiCall('/api/checkin','POST');if(r.success){toast.success(r.message);pd.textContent=r.total;loadProfile();}else{toast.error(r.error||'签到失败');}cb.disabled=false;cb.innerHTML='<img src="/svg/calendar.svg" class="is">签到';});
rb.addEventListener('click',async()=>{rm.classList.add('ac');renderLoading(rl);const r=await apiCall('/api/ranking','GET');if(r.success&&r.ranking){renderRankingList(rl,r.ranking);toast.success('排行榜加载成功');}else{renderNoData(rl);}});
rcb.addEventListener('click',()=>rm.classList.remove('ac'));
rm.addEventListener('click',(e)=>{if(e.target===rm)rm.classList.remove('ac');});
ab.addEventListener('click',async()=>{am2.classList.add('ac');renderLoading(acn);const r=await apiCall('/api/announcement','GET');if(r.success){if(r.is_active){renderAnnouncement(acn,r.title,r.content);}else{renderNoAnnouncement(acn);}toast.success('公告获取成功');}else{renderLoadFailed(acn);}});
acb.addEventListener('click',()=>am2.classList.remove('ac'));
am2.addEventListener('click',(e)=>{if(e.target===am2)am2.classList.remove('ac');});
tb.addEventListener('click',()=>{tt.value='';tp.value='';tm.classList.add('ac');});
tc.addEventListener('click',()=>tm.classList.remove('ac'));
tc2.addEventListener('click',async()=>{const t=tt.value.trim();const p=tp.value.trim();if(!t){toast.error('请输入目标用户名');return;}if(!p){toast.error('请输入积分');return;}const n=parseInt(p,10);if(isNaN(n)||n<=0){toast.error('积分必须是正整数');return;}const r=await apiCall('/api/transfer','POST',{target:t,points:n});if(r.success){toast.success(r.message);tm.classList.remove('ac');loadProfile();}else{toast.error(r.error||'转账失败');}});
tm.addEventListener('click',(e)=>{if(e.target===tm)tm.classList.remove('ac');});
lo.addEventListener('click',async()=>{const r=await apiCall('/api/logout','POST');if(r.success){toast.success(r.message);setTimeout(()=>{window.location.href='/login';},500);}else{toast.error('退出失败');}});
bb.addEventListener('click',()=>{window.location.href='/';});
loadProfile();
</script>
</body>
</html>
