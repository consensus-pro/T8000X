<div class="bg"></div>
<div class="c">

  <img src="/svg/avatar.svg" class="hi">
</div>
</div>
</div>

<!-- 模态框 -->
<div class="mo" id="qqModal"><div class="md"><h3><img src="/svg/qq.svg" class="i"> 绑定QQ</h3><div class="ib3"><input type="text" id="qqInput" placeholder="请输入QQ号" maxlength="11"></div><div class="brw"><button class="bt bv" id="qqModalCancel">取消</button><button class="bt bc" id="qqModalConfirm">确认绑定</button></div></div></div>

<script src="/api/toast.js"></script>
<script>
async function apiCall(url,method,body){try{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const res=await fetch(url,opts);return await res.json()}catch(e){return{success:false,error:'网络连接失败，请重试'}}}
const $=id=>document.getElementById(id),ue=$('profileUsername'),ee=$('profileEmail'),se=$('profileSignature'),ge=$('profileGender'),ce=$('profileCreatedAt'),ac=$('ac'),ai=$('avatarInner'),qs=$('qqStatus'),rd=$('rankDisplay'),pd=$('pointsDisplay'),qb=$('qqBindBtn'),lo=$('logoutBtn'),bb=$('backBtn'),esb=$('editSignatureBtn'),egb=$('editGenderBtn'),cb=$('checkinBtn'),rb=$('rankingBtn'),ab=$('announceBtn'),tb=$('transferBtn'),qm=$('qqModal'),qi=$('qqInput'),qmc=$('qqModalConfirm'),qmc2=$('qqModalCancel'),sm=$('signatureModal'),si=$('signatureInput'),cc=$('charCount'),smc=$('signatureModalConfirm'),smc2=$('signatureModalCancel'),gm=$('genderModal'),go=$('genderOptions'),gmc=$('genderModalConfirm'),gmc2=$('genderModalCancel'),gfh=$('genderFoldHeader'),gfb=$('genderFoldBody'),gfa=$('genderFoldArrow'),rm=$('rankingModal'),rl=$('rankingList'),rcb=$('rankingCloseBtn'),am2=$('announceModal'),acn=$('announceContent'),acb=$('announceCloseBtn'),tm=$('transferModal'),tt=$('transferTarget'),tp=$('transferPoints'),tc=$('transferCancel'),tc2=$('transferConfirm');
let cq='',cs='',cg='',sg='',fo=false;
function gc(g){return g=='男'?'#1677ff':g=='女'?'#ff69b4':g=='其他'?'#ffc107':'#888'}
function ua(q,g){const c=gc(g);ac.style.borderColor=c;ac.classList.remove('da','qa');ai.style.backgroundImage='';ai.style.backgroundSize='';ai.style.backgroundColor='';ai.style.maskImage='';ai.style.webkitMaskImage='';ai.innerHTML='';if(q){ac.classList.add('qa');ai.style.backgroundImage=`url(https://q1.qlogo.cn/g?b=qq&nk=${q}&s=640)`;ai.style.backgroundSize='cover'}else{ac.classList.add('da')}}
function us(t){se.textContent=t;t==='未填写'?se.classList.add('gt'):se.classList.remove('gt')}
function ug(t){ge.textContent=t;t==='不愿透露'?ge.classList.add('gt'):ge.classList.remove('gt')}
function ur(r,p){rd.textContent=(p>0&&r)?'#'+r:'未上榜'}
async function lp(){const r=await apiCall('/api/user','GET');if(r.success){ue.textContent=r.username;ee.textContent=r.email;cs=r.signature||'未填写';us(cs);cg=r.gender||'不愿透露';ug(cg);ce.textContent=r.created_at||'未知';cq=r.qq_number||'';pd.textContent=r.total_points||0;ur(r.rank,r.total_points);if(cq){qs.textContent=cq;qs.className='qq-status'}else{qs.textContent='未绑定';qs.className='qq-status unbind'}ua(cq,cg);
toast.success('账号数据已加载');
}else{window.location.href='/login'}}
si.addEventListener('input',function(){cc.textContent=this.value.length});
esb.addEventListener('click',()=>{si.value=cs==='未填写'?'':cs;cc.textContent=si.value.length;sm.classList.add('ac')});
smc2.addEventListener('click',()=>sm.classList.remove('ac'));
smc.addEventListener('click',async()=>{let s=si.value.trim();if(!s)s='未填写';const r=await apiCall('/api/update-signature','POST',{signature:s});if(r.success){toast.success('签名修改成功！');cs=r.signature;us(cs);sm.classList.remove('ac')}else{toast.error(r.error||'修改失败')}});
sm.addEventListener('click',e=>{if(e.target===sm)sm.classList.remove('ac')});
gfh.addEventListener('click',()=>{
    fo=!fo;
    gfb.classList.toggle('op');
    const icon = gfa.querySelector('.gsi');
    if(icon) icon.classList.toggle('op');
});
go.addEventListener('click',e=>{const o=e.target.closest('.go2');if(!o)return;document.querySelectorAll('.go2').forEach(el=>el.classList.remove('sel'));o.classList.add('sel');sg=o.dataset.value});
egb.addEventListener('click',()=>{
    fo=false;
    gfb.classList.remove('op');
    const icon = gfa.querySelector('.gsi');
    if(icon) icon.classList.remove('op');
    document.querySelectorAll('.go2').forEach(el=>el.classList.remove('sel'));
    let found=false;
    document.querySelectorAll('.go2').forEach(el=>{
        if(el.dataset.value===cg){
            el.classList.add('sel');
            sg=cg;
            found=true;
        }
    });
    if(!found){
        const def=document.querySelector('.go2[data-value="不愿透露"]');
        if(def){def.classList.add('sel');sg='不愿透露'}
    }
    gm.classList.add('ac')
});
gmc2.addEventListener('click',()=>gm.classList.remove('ac'));
gmc.addEventListener('click',async()=>{const sel=document.querySelector('.go2.sel');if(!sel){toast.error('请先展开并选择性别');return}const g=sel.dataset.value;const r=await apiCall('/api/update-gender','POST',{gender:g});if(r.success){toast.success('性别修改成功！');cg=r.gender;ug(cg);ua(cq,cg);gm.classList.remove('ac')}else{toast.error(r.error||'修改失败')}});
gm.addEventListener('click',e=>{if(e.target===gm)gm.classList.remove('ac')});
qb.addEventListener('click',()=>{qi.value=cq;qm.classList.add('ac')});
qmc2.addEventListener('click',()=>qm.classList.remove('ac'));
qmc.addEventListener('click',async()=>{const q=qi.value.trim();if(!q){toast.error('请输入QQ号');return}if(!/^\d{5,11}$/.test(q)){toast.error('请输入正确的QQ号');return}const r=await apiCall('/api/bind-qq','POST',{qq_number:q});if(r.success){toast.success('QQ绑定成功！');qm.classList.remove('ac');lp()}else{toast.error(r.error||'绑定失败')}});
qm.addEventListener('click',e=>{if(e.target===qm)qm.classList.remove('ac')});
cb.addEventListener('click',async()=>{cb.disabled=true;cb.innerHTML='<img src="/svg/loading.svg" class="is sp"> 签到中...';const r=await apiCall('/api/checkin','POST');if(r.success){toast.success(r.message);pd.textContent=r.total;lp()}else{toast.error(r.error||'签到失败')}cb.disabled=false;cb.innerHTML='<img src="/svg/calendar.svg" class="is">签到'});

// 排行榜
rb.addEventListener('click',async()=>{
    rm.classList.add('ac');
    rl.innerHTML='<div class="ls2"><img src="/svg/loading.svg" class="i sp">加载中...</div>';
    const r=await apiCall('/api/ranking','GET');
    if(r.success && r.ranking){
        let html='';
        r.ranking.forEach(item=>{
            let ah;
            if(item.avatar_url){
                ah = `<div class="ra" data-username="${item.username}" style="cursor:pointer;"><img src="${item.avatar_url}"></div>`;
            }else{
                ah = `<div class="ra rad" data-username="${item.username}" style="cursor:pointer;"></div>`;
            }
            html += `<div class="ri">
                <span class="rn">#${item.rank}</span>
                ${ah}
                <div class="ri2">
                    <span class="rn2">${item.username}</span>
                    <span class="rs">
                        <span><img src="/svg/calendar.svg" class="is"> ${item.checkin_days}</span>
                        <span><img src="/svg/coins.svg" class="is"> ${item.total_points}</span>
                    </span>
                </div>
            </div>`;
        });
        rl.innerHTML = html;
        rl.querySelectorAll('.ra, .ra.rad').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const username = this.dataset.username;
                if(username) window.location.href = '/user?id=' + username;
            });
        });
        toast.success('排行榜加载成功');
    }else{
        rl.innerHTML='<div style="text-align:center;padding:20px;color:#aaa;">暂无数据</div>';
    }
});
rcb.addEventListener('click',()=>rm.classList.remove('ac'));
rm.addEventListener('click',e=>{if(e.target===rm)rm.classList.remove('ac')});

// 公告
ab.addEventListener('click',async()=>{
    am2.classList.add('ac');
    acn.innerHTML='<div class="ls2"><img src="/svg/loading.svg" class="i sp">加载中...</div>';
    const r=await apiCall('/api/announcement','GET');
    if(r.success){
        let html='';
        if(r.is_active){
            html=`<div class="at2">${r.title||'公告'}</div><div class="ab2">${r.content||''}</div>`;
        }else{
            html='<div style="text-align:center;padding:20px;color:#aaa;">暂无公告</div>';
        }
        acn.innerHTML=html;
        toast.success('公告获取成功');
    }else{
        acn.innerHTML='<div style="text-align:center;padding:20px;color:#aaa;">加载失败</div>';
    }
});
acb.addEventListener('click',()=>am2.classList.remove('ac'));
am2.addEventListener('click',e=>{if(e.target===am2)am2.classList.remove('ac')});

tb.addEventListener('click',()=>{tt.value='';tp.value='';tm.classList.add('ac')});
tc.addEventListener('click',()=>tm.classList.remove('ac'));
tc2.addEventListener('click',async()=>{const t=tt.value.trim(),p=tp.value.trim();if(!t){toast.error('请输入目标用户名');return}if(!p){toast.error('请输入积分');return}const n=parseInt(p,10);if(isNaN(n)||n<=0){toast.error('积分必须是正整数');return}const r=await apiCall('/api/transfer','POST',{target:t,points:n});if(r.success){toast.success('转账成功');tm.classList.remove('ac');lp()}else{toast.error(r.error||'转账失败')}});
tm.addEventListener('click',e=>{if(e.target===tm)tm.classList.remove('ac')});
lo.addEventListener('click',async()=>{const r=await apiCall('/api/logout','POST');if(r.success){toast.success('已退出登录');setTimeout(()=>{window.location.href='/login'},500)}else{toast.error('退出失败')}});
bb.addEventListener('click',()=>{window.location.href='/'});
lp();
</script>
