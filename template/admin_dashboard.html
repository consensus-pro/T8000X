<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 管理员后台</title>
<link rel="stylesheet" href="/template/style.css">
</head>
<body class="d">
<div class="bg"></div>
<div class="c">
<div class="hd">
<h1><img src="/svg/admin.svg" class="il"> 管理后台</h1>
<button class="bt" id="logoutBtn"><img src="/svg/exit.svg" class="i"> 退出</button>
</div>
<div class="st">
<div class="sc"><div class="nu" id="totalUsers">0</div><div class="lb"><img src="/svg/users.svg" class="i"> 总用户数</div></div>
<div class="sc"><div class="nu" id="todayUsers">0</div><div class="lb"><img src="/svg/register.svg" class="i"> 今日注册</div></div>
</div>
<div class="fs">
<div class="fh" id="msgToggle"><span><img src="/svg/chat.svg" class="i"> 消息管理 <span id="msgCount">(0)</span></span><span id="msgArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="msgBody"><div id="msgListContainer"></div></div>
</div>
<div class="fs">
<div class="fh" id="userToggle"><span><img src="/svg/users.svg" class="i"> 用户管理 <span id="userCount">(0)</span></span><span id="userArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="userBody"><div id="userListContainer"></div></div>
</div>
<div class="fs">
<div class="fh" id="statsToggle"><span><img src="/svg/data.svg" class="i"> 访问统计 <span id="statsCount">(0)</span></span><span id="statsArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="statsBody"><div id="statsListContainer"></div></div>
</div>
<div class="fs">
<div class="fh" id="announceToggle"><span><img src="/svg/net.svg" class="i"> 公告</span><span id="announceArrow"><img src="/svg/switch.svg" class="i ar"></span></div>
<div class="fb" id="announceBody">
<div class="af">
<div class="sw"><label>公告开关</label><input type="checkbox" id="announceSwitch"></div>
<input type="text" id="announceTitle" placeholder="公告标题">
<textarea id="announceContent" placeholder="公告内容"></textarea>
<button class="bsb" id="announceSubmit">确定</button>
</div>
</div>
</div>
</div>
<div class="mo" id="resetPwdModal">
<div class="md">
<h3>修改密码</h3>
<div class="ib"><input type="password" id="newPwdInput" placeholder="输入新密码"></div>
<div class="brw"><button class="bt bv" id="resetPwdCancel">取消</button><button class="bt bc" id="resetPwdConfirm"><img src="/svg/lock.svg" class="is"> 确认</button></div>
</div>
</div>
<div class="mo" id="updatePointsModal">
<div class="md">
<h3>修改积分</h3>
<div class="ib"><input type="number" id="pointsInput" placeholder="输入积分（支持负数）" step="1"></div>
<div class="brw"><button class="bt bv" id="pointsCancel">取消</button><button class="bt bc" id="pointsConfirm"><img src="/svg/coins.svg" class="is"> 确认</button></div>
</div>
</div>
<template id="tpl-loading"><div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div></template>
<template id="tpl-empty"><div class="ep">暂无数据</div></template>
<template id="tpl-error"><div class="ep" data-field="message">加载失败</div></template>
<template id="tpl-user-item"><div class="ui"><span class="un" data-field="username"></span><span class="em" data-field="email"></span><span class="dt" data-field="created_at"></span><span class="bgp" data-field="actions"></span></div></template>
<template id="tpl-message-item"><div class="mi" data-id=""><div class="mt"><div class="mx"><span class="mu" data-field="username"></span><span class="mc" data-field="content"></span></div><button class="md" data-id="" type="button">删除</button></div><div class="mt2" data-field="created_at"></div></div></template>
<template id="tpl-stats-item"><div class="si"><span data-field="path"></span><span data-field="count"></span></div></template>
<template id="tpl-stats-card"><div class="sc2"><div class="sn" data-field="count">0</div><div class="sl" data-field="label">页面</div></div></template>
<template id="tpl-user-actions-normal"><a href="" class="bs bd" data-field="detail_link">详细</a><button class="bs br" data-id="" data-action="resetPwd">修改密码</button><button class="bs bp" data-id="" data-action="updatePoints">修改积分</button><button class="bs bx" data-id="" data-action="deleteUser">删除</button></template>
<template id="tpl-user-actions-admin"><span style="color:#888;font-size:13px;">-</span></template>
<script src="/api/toast.js"></script>
<script>
"use strict";
function cloneTemplate(id){var tpl=document.getElementById(id);return tpl.content.cloneNode(true);}
function fillText(el,selector,text){var target=el.querySelector(selector);if(target)target.textContent=text;}
function fillHtml(el,selector,html){var target=el.querySelector(selector);if(target)target.innerHTML=html;}
function setAttr(el,selector,attr,value){var target=el.querySelector(selector);if(target)target.setAttribute(attr,value);}
var $=function(id){return document.getElementById(id);};
function isToday(dateStr){var t=new Date(dateStr);var n=new Date();return t.getDate()===n.getDate()&&t.getMonth()===n.getMonth()&&t.getFullYear()===n.getFullYear();}
async function apiCall(url,method,body){var opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);var r=await fetch(url,opts);return await r.json();}
var ul=$('userListContainer'),tu=$('totalUsers'),tdd=$('todayUsers'),uc=$('userCount'),mt=$('msgToggle'),mb=$('msgBody'),ma=$('msgArrow'),ml=$('msgListContainer'),mc2=$('msgCount'),ut=$('userToggle'),ub=$('userBody'),ua=$('userArrow'),at=$('announceToggle'),ab2=$('announceBody'),aa=$('announceArrow'),asw=$('announceSwitch'),ati=$('announceTitle'),acn=$('announceContent'),asb=$('announceSubmit'),rp=$('resetPwdModal'),np=$('newPwdInput'),rc=$('resetPwdCancel'),rcc=$('resetPwdConfirm'),up=$('updatePointsModal'),pi2=$('pointsInput'),pc=$('pointsCancel'),pc2=$('pointsConfirm'),stt=$('statsToggle'),stb=$('statsBody'),sta=$('statsArrow'),stl=$('statsListContainer'),stc=$('statsCount');
var cru=null,cpu=null,uload=false,mload=false,aload=false,sload=false,uopen=false,mopen=false,aopen=false,sopen=false;
function renderLoading(container){container.innerHTML='';var clone=cloneTemplate('tpl-loading');container.appendChild(clone);}
function renderEmpty(container){container.innerHTML='';var clone=cloneTemplate('tpl-empty');container.appendChild(clone);}
function renderError(container,msg){container.innerHTML='';var clone=cloneTemplate('tpl-error');var msgEl=clone.querySelector('[data-field="message"]');if(msgEl)msgEl.textContent=msg||'加载失败';container.appendChild(clone);}
function renderUserItem(user){var clone=cloneTemplate('tpl-user-item');fillText(clone,'[data-field="username"]',user.username+(user.is_admin?' <span class="ab">管理员</span>':''));fillText(clone,'[data-field="email"]',user.email);fillText(clone,'[data-field="created_at"]',user.created_at||'未知');var actionsContainer=clone.querySelector('[data-field="actions"]');if(user.is_admin){var adminClone=cloneTemplate('tpl-user-actions-admin');actionsContainer.appendChild(adminClone);}else{var normalClone=cloneTemplate('tpl-user-actions-normal');var detailLink=normalClone.querySelector('[data-field="detail_link"]');if(detailLink)detailLink.href='/user?id='+encodeURIComponent(user.username);var btns=normalClone.querySelectorAll('button[data-id]');btns.forEach(function(btn){btn.dataset.id=user.id;});actionsContainer.appendChild(normalClone);}return clone;}
function renderUserList(container,users){container.innerHTML='';if(!users||users.length===0){renderEmpty(container);return;}var fragment=document.createDocumentFragment();users.forEach(function(user){var clone=renderUserItem(user);fragment.appendChild(clone);});container.appendChild(fragment);}
function renderMessageItem(msg){var clone=cloneTemplate('tpl-message-item');clone.firstElementChild.dataset.id=msg.id;fillText(clone,'[data-field="username"]',msg.username);fillText(clone,'[data-field="content"]',msg.content||'');fillText(clone,'[data-field="created_at"]',msg.created_at||'');var delBtn=clone.querySelector('.md');if(delBtn)delBtn.dataset.id=msg.id;return clone;}
function renderMessageList(container,messages){container.innerHTML='';if(!messages||messages.length===0){renderEmpty(container);return;}var fragment=document.createDocumentFragment();messages.forEach(function(msg){var clone=renderMessageItem(msg);fragment.appendChild(clone);});container.appendChild(fragment);}
function renderStatsCard(label,count){var clone=cloneTemplate('tpl-stats-card');fillText(clone,'[data-field="count"]',count);fillText(clone,'[data-field="label"]',label);return clone;}
function renderStatsList(container,views,total){container.innerHTML='';var pathMap={'/login':'登录','/register':'注册','/':'聊天','/profile':'设置'};var counts={};Object.keys(pathMap).forEach(function(p){counts[p]=0;});views.forEach(function(v){if(pathMap[v.path])counts[v.path]=v.count;});var header=document.createElement('div');header.style.cssText='padding:4px 0;font-weight:600;color:#0a0a0a;border-bottom:1px solid #e5e5e5;padding-bottom:8px;display:flex;justify-content:space-between;';header.innerHTML='<span>总访问量：'+total+'</span>';container.appendChild(header);var grid=document.createElement('div');grid.className='sg';Object.keys(pathMap).forEach(function(p){var card=renderStatsCard(pathMap[p],counts[p]||0);grid.appendChild(card);});container.appendChild(grid);}
async function loadUserList(){if(uload)return;renderLoading(ul);try{var r=await apiCall('/api/admin/users','GET');if(!r.success){if(r.error==='未登录'||r.error==='权限不足'){window.location.href='/admin';return;}renderError(ul,r.error||'加载失败');return;}var users=r.users||[];var total=users.length;var todayCount=users.filter(function(u){return isToday(u.created_at);}).length;tu.textContent=total;tdd.textContent=todayCount;uc.textContent='('+total+')';renderUserList(ul,users);uload=true;toast.success('用户列表加载成功');}catch(e){renderError(ul,'加载失败，请刷新');}}
async function loadMessages(){if(mload)return;renderLoading(ml);try{var r=await apiCall('/api/admin/messages','GET');if(!r.success){renderError(ml,r.error||'加载失败');return;}var msgs=r.messages||[];mc2.textContent='('+msgs.length+')';renderMessageList(ml,msgs);mload=true;toast.success('消息列表加载成功');}catch(e){renderError(ml,'加载失败');}}
async function loadAnnouncement(){if(aload)return;try{var r=await apiCall('/api/announcement','GET');if(r.success){asw.checked=r.is_active;ati.value=r.title||'';acn.value=r.content||'';aload=true;}}catch(e){}}
async function loadStats(){if(sload)return;renderLoading(stl);try{var r=await apiCall('/api/admin/page-views','GET');if(!r.success){renderError(stl,r.error||'加载失败');return;}var views=r.views||[];stc.textContent='('+views.length+')';renderStatsList(stl,views,r.total);sload=true;toast.success('统计信息加载成功');}catch(e){renderError(stl,'加载失败');}}
mt.addEventListener('click',function(){mopen=!mopen;mb.classList.toggle('op');var a=ma.querySelector('img');if(a)a.classList.toggle('rt');if(mopen)loadMessages();});
ut.addEventListener('click',function(){uopen=!uopen;ub.classList.toggle('op');var a=ua.querySelector('img');if(a)a.classList.toggle('rt');if(uopen)loadUserList();});
stt.addEventListener('click',function(){sopen=!sopen;stb.classList.toggle('op');var a=sta.querySelector('img');if(a)a.classList.toggle('rt');if(sopen&&!sload)loadStats();});
at.addEventListener('click',function(){aopen=!aopen;ab2.classList.toggle('op');var a=aa.querySelector('img');if(a)a.classList.toggle('rt');if(aopen&&!aload)loadAnnouncement();});
ml.addEventListener('click',async function(e){var btn=e.target.closest('.md');if(!btn)return;var id=btn.dataset.id;var item=btn.closest('.mi');try{var r=await apiCall('/api/admin/messages/'+id,'DELETE');if(r.success){toast.success(r.message);if(item&&item.parentNode)item.remove();var rem=ml.querySelectorAll('.mi').length;mc2.textContent='('+rem+')';if(!rem)renderEmpty(ml);}else{toast.error(r.error||'删除失败');}}catch(e){toast.error('网络错误');}});
ul.addEventListener('click',async function(e){var btn=e.target.closest('.bs');if(!btn)return;var uid=btn.dataset.id;var action=btn.dataset.action;if(action==='deleteUser'){if(!confirm('确定要删除这个用户吗？此操作不可恢复！'))return;var r=await apiCall('/api/admin/users/'+uid,'DELETE');if(r.success){toast.success(r.message);uload=false;loadUserList();var u=await apiCall('/api/admin/users','GET');if(u.success){tu.textContent=u.users.length;uc.textContent='('+u.users.length+')';}}else{toast.error(r.error||'删除失败');}}else if(action==='resetPwd'){cru=uid;np.value='';rp.classList.add('ac');}else if(action==='updatePoints'){cpu=uid;pi2.value='';up.classList.add('ac');}});
rc.addEventListener('click',function(){rp.classList.remove('ac');cru=null;});
rcc.addEventListener('click',async function(){var p=np.value.trim();if(p.length<6){toast.error('密码至少6位');return;}var r=await apiCall('/api/admin/users/'+cru+'/reset-password','POST',{new_password:p});if(r.success){toast.success(r.message);rp.classList.remove('ac');cru=null;}else{toast.error(r.error||'重置失败');}});
rp.addEventListener('click',function(e){if(e.target===rp){rp.classList.remove('ac');cru=null;}});
pc.addEventListener('click',function(){up.classList.remove('ac');cpu=null;});
pc2.addEventListener('click',async function(){var v=pi2.value.trim();if(v===''){toast.error('请输入积分');return;}var p=parseInt(v,10);if(isNaN(p)){toast.error('请输入有效整数');return;}var r=await apiCall('/api/admin/users/'+cpu+'/update-points','POST',{points:p});if(r.success){toast.success(r.message);up.classList.remove('ac');cpu=null;uload=false;loadUserList();}else{toast.error(r.error||'更新失败');}});
up.addEventListener('click',function(e){if(e.target===up){up.classList.remove('ac');cpu=null;}});
$('logoutBtn').addEventListener('click',async function(){await apiCall('/api/logout','POST');window.location.href='/admin';});
asb.addEventListener('click',async function(){var t=ati.value.trim();var c=acn.value.trim();if(!t||!c){toast.error('标题和内容不能为空');return;}var r=await apiCall('/api/admin/announcement','POST',{title:t,content:c,is_active:asw.checked});if(r.success)toast.success(r.message);else toast.error(r.error||'修改失败');});
toast.success('Hello Admin');
loadMessages();loadUserList();loadStats();loadAnnouncement();
</script>
</body>
</html>
