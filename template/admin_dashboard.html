<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 管理员后台</title>
<style>
*{m:0;p:0;bx:border-box;-webkit-tap-highlight-color:transparent;f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{bg:#fff;mh:100vh;p:20px;pos:relative}
.bg{pos:fixed;t:0;l:0;r:0;b:0;bg-img:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);bg-size:50px 50px;pe:none;z:0}
.c{max-width:900px;margin:0 auto;pos:relative;z:1}
.i{width:18px;height:18px;d:inline-block;va:middle;fs:0;filter:brightness(0)saturate(100%)}
.is{width:14px;height:14px;d:inline-block;va:middle;fs:0;filter:brightness(0)saturate(100%)}
.im{width:20px;height:20px;d:inline-block;va:middle;fs:0;filter:brightness(0)saturate(100%)}
.il{width:28px;height:28px;d:inline-block;va:middle;fs:0;filter:brightness(0)saturate(100%)}
.iw{filter:brightness(0)invert(1)}
.sp{animation:spn 1.2s linear infinite;d:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hd{df:flex;jc:space-between;ai:center;bg:#fff;p:16px 24px;br:10px;mb:20px;bd:1px solid #e5e5e5}
.hd h1{font-size:18px;fw:700;color:#0a0a0a;df:flex;ai:center;gap:8px}
.hd .bt{p:8px 18px;bg:#f8f8f8;color:#333;bd:1px solid #e5e5e5;br:8px;cursor:pointer;font-size:14px;transition:all .2s;df:flex;ai:center;gap:6px}
.hd .bt:hover{bg:#e5e5e5}
.hd .bt .i{filter:brightness(0)saturate(100%)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;mb:20px}
.sc{bg:#fff;p:16px 20px;br:10px;text-align:center;bd:1px solid #e5e5e5}
.sc .nu{font-size:28px;fw:700;color:#0a0a0a}
.sc .lb{color:#888;font-size:13px;mt:4px;df:flex;ai:center;jc:center;gap:4px}
.fs{bg:#fff;bd:1px solid #e5e5e5;br:10px;mb:20px;overflow:hidden}
.fh{p:14px 20px;bg:#f8f8f8;df:flex;jc:space-between;ai:center;cursor:pointer;user-select:none}
.fh span{fw:600;color:#333;df:flex;ai:center;gap:6px}
.fb{p:0 16px;max-height:0;overflow:hidden;opacity:0;transition:max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease}
.fb.op{max-height:500px;p:8px 16px;opacity:1;overflow-y:auto}
.mi{p:8px 0;bd-bottom:1px solid #e5e5e5}
.mi:last-child{bd-bottom:none}
.mi .mt{df:flex;jc:space-between;ai:flex-start;gap:12px}
.mi .mt .mx{df:flex;flex-wrap:wrap;ai:baseline;gap:2px;flex:1;min-width:0}
.mi .mt .mx .mu{fw:600;color:#1677ff;font-size:12px;fs:0}
.mi .mt .mx .mu::after{content:': ';color:#1677ff}
.mi .mt .mx .mc{color:#333;font-size:10px;word-break:break-word;flex:1;min-width:0}
.mi .mt .md{p:1px 10px;bg:#d9534f;color:#fff;bd:none;br:4px;cursor:pointer;font-size:10px;fs:0;h:20px}
.mi .mt .md:hover{bg:#c9302c}
.mi .mt2{color:#bbb;font-size:6px;mt:1px;pl:0}
.ep{text-align:center;p:30px 0;color:#aaa;font-size:14px}
.lo{text-align:center;p:30px 0;color:#aaa;df:flex;ai:center;jc:center;gap:6px}
.ui .bgp{df:flex;gap:4px;ai:center;flex-wrap:nowrap}
.ui .bs{p:4px 8px;bd:none;br:6px;cursor:pointer;font-size:11px;transition:background .2s;text-decoration:none;d:inline-flex;ai:center;white-space:nowrap;gap:3px;fs:0}
.bd{bg:#0a0a0a;color:#fff}
.bd:hover{bg:#222}
.bx{bg:#d9534f;color:#fff}
.bx:hover{bg:#c9302c}
.br,.bp{bg:#0a0a0a;color:#fff}
.br:hover,.bp:hover{bg:#222}
.ui{display:grid;grid-template-columns:1.2fr 1.8fr 1.2fr 2fr;p:8px 10px;bd-bottom:1px solid #f1f3f5;ai:center;color:#333;font-size:13px;gap:6px}
.ui:last-child{bd-bottom:none}
.ui .un{fw:600;color:#0a0a0a;font-size:13px}
.ui .em{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui .dt{color:#888;font-size:11px;white-space:nowrap}
.ui .ab{bg:#0a0a0a;color:#fff;font-size:10px;p:1px 8px;br:10px;d:inline-block;ml:4px}
.mo{display:none;pos:fixed;inset:0;bg:rgba(0,0,0,0.4);z-index:999;jc:center;ai:center}
.mo.ac{display:flex}
.md{bg:#fff;br:16px;p:24px;width:90%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.2)}
.md h3{font-size:18px;mb:16px;text-align:center}
.md .ib{mb:16px}
.md .ib input{width:100%;p:12px 14px;bd:1px solid #ddd;br:8px;font-size:15px;outline:none}
.md .ib input:focus{bd-color:#0a0a0a}
.md .brw{df:flex;gap:10px}
.md .brw .bt{flex:1;p:12px;bd:none;br:8px;font-size:15px;fw:600;cursor:pointer;transition:background .2s}
.md .brw .bc{bg:#0a0a0a;color:#fff}
.md .brw .bc .i{filter:brightness(0)invert(1)}
.md .brw .bc:hover{bg:#222}
.md .brw .bv{bg:#f0f0f0;color:#333}
.md .brw .bv:hover{bg:#e0e0e0}
.af{df:flex;flex-direction:column;gap:12px;p:8px 0}
.af .sw{df:flex;ai:center;gap:8px}
.af .sw input[type="checkbox"]{width:40px;height:22px;appearance:none;bg:#ccc;br:11px;pos:relative;outline:none;transition:.2s;cursor:pointer;fs:0}
.af .sw input[type="checkbox"]:checked{bg:#0a0a0a}
.af .sw input[type="checkbox"]::after{content:'';pos:absolute;t:50%;transform:translateY(-50%);l:2px;width:18px;height:18px;bg:#fff;br:50%;transition:.2s}
.af .sw input[type="checkbox"]:checked::after{l:calc(100% - 20px)}
.af input,.af textarea{width:100%;p:10px 12px;bd:1px solid #ddd;br:8px;font-size:14px;f:inherit;outline:none;transition:border-color .2s}
.af input:focus,.af textarea:focus{bd-color:#0a0a0a}
.af textarea{resize:vertical;min-height:80px}
.af .bsb{p:10px 20px;bg:#0a0a0a;color:#fff;bd:none;br:8px;font-size:14px;fw:600;cursor:pointer;transition:background .2s;align-self:flex-start}
.af .bsb .i{filter:brightness(0)invert(1)}
.af .bsb:hover{bg:#222}
input[type="checkbox"]{accent-color:#000}
.ar{transition:transform .3s ease}
.ar.rt{transform:rotate(90deg)}
.si{df:flex;jc:space-between;p:6px 0;bd-bottom:1px solid #f1f3f5;font-size:13px}
.si:last-child{bd-bottom:none}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;p:4px 0}
.sg .sc2{text-align:center;p:6px 4px;bg:#f8f8f8;br:6px}
.sg .sc2 .sn{fw:700;color:#0a0a0a;font-size:16px}
.sg .sc2 .sl{font-size:11px;color:#888}
@media (max-width:640px){.st{grid-template-columns:1fr 1fr}.ui{grid-template-columns:1fr;gap:4px;p:10px 12px}.ui .bgp{justify-content:flex-start;flex-wrap:wrap}.ui .bs{p:4px 8px;font-size:11px}.mi .mt{flex-wrap:wrap}.mi .mt .md{margin-left:auto}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="hd"><h1><img src="/svg/admin.svg" class="il"> 管理后台</h1><button class="bt" id="logoutBtn"><img src="/svg/exit.svg" class="i"> 退出</button></div>
<div class="st"><div class="sc"><div class="nu" id="totalUsers">0</div><div class="lb"><img src="/svg/users.svg" class="i"> 总用户数</div></div><div class="sc"><div class="nu" id="todayUsers">0</div><div class="lb"><img src="/svg/register.svg" class="i"> 今日注册</div></div></div>
<div class="fs"><div class="fh" id="msgToggle"><span><img src="/svg/chat.svg" class="i"> 消息管理 <span id="msgCount">(0)</span></span><span id="msgArrow"><img src="/svg/switch.svg" class="i ar"></span></div><div class="fb" id="msgBody"><div id="msgListContainer"><div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div></div></div></div>
<div class="fs"><div class="fh" id="userToggle"><span><img src="/svg/users.svg" class="i"> 用户管理 <span id="userCount">(0)</span></span><span id="userArrow"><img src="/svg/switch.svg" class="i ar"></span></div><div class="fb" id="userBody"><div id="userListContainer"><div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div></div></div></div>
<div class="fs"><div class="fh" id="statsToggle"><span><img src="/svg/data.svg" class="i"> 访问统计 <span id="statsCount">(0)</span></span><span id="statsArrow"><img src="/svg/switch.svg" class="i ar"></span></div><div class="fb" id="statsBody"><div id="statsListContainer"><div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div></div></div></div>
<div class="fs"><div class="fh" id="announceToggle"><span><img src="/svg/net.svg" class="i"> 公告</span><span id="announceArrow"><img src="/svg/switch.svg" class="i ar"></span></div><div class="fb" id="announceBody"><div class="af"><div class="sw"><label>公告开关</label><input type="checkbox" id="announceSwitch"></div><input type="text" id="announceTitle" placeholder="公告标题"><textarea id="announceContent" placeholder="公告内容"></textarea><button class="bsb" id="announceSubmit">确定</button></div></div></div>
</div>
<div class="mo" id="resetPwdModal"><div class="md"><h3>修改密码</h3><div class="ib"><input type="password" id="newPwdInput" placeholder="输入新密码"></div><div class="brw"><button class="bt bv" id="resetPwdCancel">取消</button><button class="bt bc" id="resetPwdConfirm"><img src="/svg/lock.svg" class="is"> 确认</button></div></div></div>
<div class="mo" id="updatePointsModal"><div class="md"><h3>修改积分</h3><div class="ib"><input type="number" id="pointsInput" placeholder="请输入积分" step="1"></div><div class="brw"><button class="bt bv" id="pointsCancel">取消</button><button class="bt bc" id="pointsConfirm"><img src="/svg/coins.svg" class="is"> 确认</button></div></div></div>

<script src="/api/toast.js"></script>
<script>
!function(){const $=id=>document.getElementById(id),ul=$('userListContainer'),tu=$('totalUsers'),tdd=$('todayUsers'),uc=$('userCount'),mt=$('msgToggle'),mb=$('msgBody'),ma=$('msgArrow'),ml=$('msgListContainer'),mc2=$('msgCount'),ut=$('userToggle'),ub=$('userBody'),ua=$('userArrow'),at=$('announceToggle'),ab2=$('announceBody'),aa=$('announceArrow'),asw=$('announceSwitch'),ati=$('announceTitle'),acn=$('announceContent'),asb=$('announceSubmit'),rp=$('resetPwdModal'),np=$('newPwdInput'),rc=$('resetPwdCancel'),rcc=$('resetPwdConfirm'),up=$('updatePointsModal'),pi2=$('pointsInput'),pc=$('pointsCancel'),pc2=$('pointsConfirm'),stt=$('statsToggle'),stb=$('statsBody'),sta=$('statsArrow'),stl=$('statsListContainer'),stc=$('statsCount');let cru=null,cpu=null,uload=!1,mload=!1,aload=!1,sload=!1,uopen=!1,mopen=!1,aopen=!1,sopen=!1;
const apiCall=async(url,method,body)=>{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const r=await fetch(url,opts);return await r.json()},isToday=d=>{const t=new Date(d),n=new Date;return t.getDate()===n.getDate()&&t.getMonth()===n.getMonth()&&t.getFullYear()===n.getFullYear()};
const loadUserList=async()=>{if(uload)return;ul.innerHTML='<div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div>';try{const r=await apiCall('/api/admin/users','GET');if(!r.success){if(r.error==='未登录'||r.error==='权限不足'){window.location.href='/admin';return}ul.innerHTML=`<div class="ep">${r.error||'加载失败'}</div>`;return}const u=r.users||[],t=u.length,td=u.filter(u=>isToday(u.created_at)).length;tu.textContent=t;tdd.textContent=td;uc.textContent=`(${t})`;if(!u.length){ul.innerHTML='<div class="ep">暂无用户</div>';uload=!0;return}const f=document.createDocumentFragment();u.forEach(u=>{const d=document.createElement('div');d.className='ui';const ia=u.is_admin||!1;d.innerHTML=`<span class="un">${u.username}${ia?' <span class="ab">管理员</span>':''}</span><span class="em">${u.email}</span><span class="dt">${u.created_at||'未知'}</span><span class="bgp">${ia?'<span style="color:#888;font-size:13px;">-</span>':`<a href="/user?id=${encodeURIComponent(u.username)}" class="bs bd">详细</a><button class="bs br" data-id="${u.id}" data-action="resetPwd">修改密码</button><button class="bs bp" data-id="${u.id}" data-action="updatePoints">修改积分</button><button class="bs bx" data-id="${u.id}" data-action="deleteUser">删除</button>`}</span>`;f.appendChild(d)});ul.innerHTML='';ul.appendChild(f);uload=!0;toast.success('用户列表加载成功')}catch(e){ul.innerHTML='<div class="ep">加载失败，请刷新</div>'}};
const loadMessages=async()=>{if(mload)return;ml.innerHTML='<div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div>';try{const r=await apiCall('/api/admin/messages','GET');if(!r.success){ml.innerHTML=`<div class="ep">${r.error||'加载失败'}</div>`;return}const msgs=r.messages||[];mc2.textContent=`(${msgs.length})`;if(!msgs.length){ml.innerHTML='<div class="ep">暂无消息</div>';return}const f=document.createDocumentFragment();msgs.forEach(m=>{const item=document.createElement('div');item.className='mi';item.dataset.id=m.id;const top=document.createElement('div');top.className='mt';const textDiv=document.createElement('div');textDiv.className='mx';const userSpan=document.createElement('span');userSpan.className='mu';userSpan.textContent=m.username;const contentSpan=document.createElement('span');contentSpan.className='mc';contentSpan.textContent=m.content||'';textDiv.appendChild(userSpan);textDiv.appendChild(contentSpan);const del=document.createElement('button');del.className='md';del.dataset.id=m.id;del.textContent='删除';del.type='button';top.appendChild(textDiv);top.appendChild(del);const time=document.createElement('div');time.className='mt2';time.textContent=m.created_at||'';item.appendChild(top);item.appendChild(time);f.appendChild(item)});ml.innerHTML='';ml.appendChild(f);mload=!0;toast.success('消息列表加载成功')}catch(e){ml.innerHTML='<div class="ep">加载失败</div>'}};
const loadAnnouncement=async()=>{if(aload)return;try{const r=await apiCall('/api/announcement','GET');if(r.success){asw.checked=r.is_active;ati.value=r.title||'';acn.value=r.content||'';aload=!0}}catch(e){}};
const loadStats=async()=>{if(sload)return;stl.innerHTML='<div class="lo"><img src="/svg/loading.svg" class="i sp"> 加载中...</div>';try{const r=await apiCall('/api/admin/page-views','GET');if(!r.success){stl.innerHTML=`<div class="ep">${r.error||'加载失败'}</div>`;return}const views=r.views||[];const pathMap={'/login':'登录','/register':'注册','/':'聊天','/profile':'设置'};const counts={};Object.keys(pathMap).forEach(p=>counts[p]=0);views.forEach(v=>{if(pathMap[v.path])counts[v.path]=v.count});stc.textContent=`(${views.length})`;let html=`<div style="padding:4px 0;font-weight:600;color:#0a0a0a;border-bottom:1px solid #e5e5e5;padding-bottom:8px;display:flex;justify-content:space-between;"><span>总访问量：${r.total}</span></div><div class="sg">`;Object.keys(pathMap).forEach(p=>{html+=`<div class="sc2"><div class="sn">${counts[p]}</div><div class="sl">${pathMap[p]}</div></div>`});html+=`</div>`;stl.innerHTML=html;sload=!0;toast.success('统计信息加载成功')}catch(e){stl.innerHTML='<div class="ep">加载失败</div>'}};
mt.addEventListener('click',()=>{mopen=!mopen;mb.classList.toggle('op');const a=ma.querySelector('img');if(a)a.classList.toggle('rt');if(mopen)loadMessages()});
ut.addEventListener('click',()=>{uopen=!uopen;ub.classList.toggle('op');const a=ua.querySelector('img');if(a)a.classList.toggle('rt');if(uopen)loadUserList()});
stt.addEventListener('click',()=>{sopen=!sopen;stb.classList.toggle('op');const a=sta.querySelector('img');if(a)a.classList.toggle('rt');if(sopen&&!sload)loadStats()});
at.addEventListener('click',()=>{aopen=!aopen;ab2.classList.toggle('op');const a=aa.querySelector('img');if(a)a.classList.toggle('rt');if(aopen&&!aload)loadAnnouncement()});
ml.addEventListener('click',async e=>{const btn=e.target.closest('.md');if(!btn)return;const id=btn.dataset.id,item=btn.closest('.mi');try{const r=await apiCall(`/api/admin/messages/${id}`,'DELETE');if(r.success){toast.success('删除成功');if(item&&item.parentNode)item.remove();const rem=ml.querySelectorAll('.mi').length;mc2.textContent=`(${rem})`;if(!rem)ml.innerHTML='<div class="ep">暂无消息</div>'}else toast.error(r.error||'删除失败')}catch(e){toast.error('网络错误')}});
ul.addEventListener('click',async e=>{const btn=e.target.closest('.bs');if(!btn)return;const uid=btn.dataset.id,action=btn.dataset.action;if(action==='deleteUser'){if(!confirm('确定要删除这个用户吗？此操作不可恢复！'))return;const r=await apiCall(`/api/admin/users/${uid}`,'DELETE');if(r.success){toast.success('删除成功');uload=!1;loadUserList();const u=await apiCall('/api/admin/users','GET');if(u.success){tu.textContent=u.users.length;uc.textContent=`(${u.users.length})`}}else toast.error(r.error||'删除失败')}else if(action==='resetPwd'){cru=uid;np.value='';rp.classList.add('ac')}else if(action==='updatePoints'){cpu=uid;pi2.value='';up.classList.add('ac')}});
rc.addEventListener('click',()=>{rp.classList.remove('ac');cru=null});
rcc.addEventListener('click',async()=>{const p=np.value.trim();if(p.length<6){toast.error('密码至少6位');return}const r=await apiCall(`/api/admin/users/${cru}/reset-password`,'POST',{new_password:p});if(r.success){toast.success('密码已重置');rp.classList.remove('ac');cru=null}else toast.error(r.error||'重置失败')});
pc.addEventListener('click',()=>{up.classList.remove('ac');cpu=null});
pc2.addEventListener('click',async()=>{const v=pi2.value.trim();if(v===''){toast.error('请输入积分');return}const p=parseInt(v,10);if(isNaN(p)){toast.error('请输入有效整数');return}const r=await apiCall(`/api/admin/users/${cpu}/update-points`,'POST',{points:p});if(r.success){toast.success('积分已更新');up.classList.remove('ac');cpu=null;uload=!1;loadUserList()}else toast.error(r.error||'更新失败')});
rp.addEventListener('click',e=>{if(e.target===rp){rp.classList.remove('ac');cru=null}});
up.addEventListener('click',e=>{if(e.target===up){up.classList.remove('ac');cpu=null}});
$('logoutBtn').addEventListener('click',async()=>{await apiCall('/api/logout','POST');window.location.href='/admin'});
asb.addEventListener('click',async()=>{const t=ati.value.trim(),c=acn.value.trim();if(!t||!c){toast.error('标题和内容不能为空');return}const r=await apiCall('/api/admin/announcement','POST',{title:t,content:c,is_active:asw.checked});if(r.success)toast.success('公告已修改');else toast.error(r.error||'修改失败')});
toast.success('Hello Admin');
loadMessages();loadUserList();loadStats();loadAnnouncement()}();
</script>
</body>
</html>
