<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 注册</title>
<link rel="stylesheet" href="/template/style.css">
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="ls"><img src="/svg/icon.svg" class="il"><div class="lt">T8000X网络</div></div>
<div class="ts"><a href="/login">登录</a><a class="ac" href="/register">注册</a></div>
<div class="fg"><div class="iwr"><img src="/svg/user.svg" class="i"><input type="text" id="regUsername" placeholder="请输入账号"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/lock.svg" class="i"><input type="password" id="regPassword" placeholder="请输入密码"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/email.svg" class="i"><input type="email" id="regEmail" placeholder="请输入邮箱"></div></div>
<div class="fg"><div class="cr"><div class="iwr"><img src="/svg/shield.svg" class="i"><input type="text" id="regCode" placeholder="邮箱验证码"></div><button class="cb" id="sendCodeBtn">获取验证码</button></div></div>
<button class="bt" id="registerBtn"><img src="/svg/register.svg" class="iw"> 注册</button>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){const $=id=>document.getElementById(id),u=$('regUsername'),p=$('regPassword'),e=$('regEmail'),c=$('regCode'),regBtn=$('registerBtn'),sendBtn=$('sendCodeBtn');let timer=null,seconds=0;
const api=async(url,method,body)=>{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const r=await fetch(url,opts);return await r.json()};
sendBtn.addEventListener('click',async()=>{const em=e.value.trim();if(!em){toast.error('请输入邮箱');return}sendBtn.disabled=true;sendBtn.textContent='发送中...';const r=await api('/api/send-code','POST',{email:em});if(r.success){toast.success(r.message);seconds=60;sendBtn.textContent=seconds+'s';if(timer)clearInterval(timer);timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);sendBtn.textContent='获取验证码';sendBtn.disabled=false}else sendBtn.textContent=seconds+'s'},1000)}else{toast.error(r.error||'发送失败');sendBtn.disabled=false;sendBtn.textContent='获取验证码'}});
regBtn.addEventListener('click',async()=>{const un=u.value.trim(),pw=p.value.trim(),em=e.value.trim(),cd=c.value.trim();if(!un||!pw||!em||!cd){toast.error('请填写所有字段');return}regBtn.disabled=true;regBtn.innerHTML='<img src="/svg/loading.svg" class="iw sp"> 注册中...';const r=await api('/api/register','POST',{username:un,password:pw,email:em,code:cd});if(r.success){toast.success(r.message);regBtn.disabled=false;regBtn.innerHTML='<img src="/svg/register.svg" class="iw"> 注册';setTimeout(()=>{window.location.href='/login'},1000)}else{toast.error(r.error||'注册失败');regBtn.disabled=false;regBtn.innerHTML='<img src="/svg/register.svg" class="iw"> 注册'}})}();
</script>
</body>
</html>
