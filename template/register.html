<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 注册</title>
<style>
*{m:0;p:0;bx:border-box;f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{bg:#fff;df:flex;jc:center;ai:center;mh:100vh;p:20px;pos:relative}
.bg{pos:fixed;t:0;l:0;r:0;b:0;bg-img:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);bg-size:50px 50px;pe:none;z:0}
.c{width:100%;max-width:340px;margin:0 auto;pos:relative;z:1;p:20px 0}
.i,.iw{width:16px;height:16px;d:inline-block;va:middle;fs:0}
.i{filter:brightness(0)saturate(100%)}
.iw{filter:brightness(0)invert(1)}
.il{width:48px;height:48px;d:block;margin:0 auto 6px;filter:brightness(0)saturate(100%)}
.sp{animation:spn 1s linear infinite;d:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ls{text-align:center;mb:18px}
.ls .lt{font-size:18px;fw:700;color:#0a0a0a;ls:.5px}
.ts{df:flex;gap:0;mb:18px;bg:#f0f0f0;br:8px;p:3px}
.ts a{flex:1;p:7px 0;text-align:center;bg:transparent;color:#888;font-size:13px;fw:600;cursor:pointer;br:6px;transition:all .3s ease;text-decoration:none}
.ts a.ac{bg:#0a0a0a;color:#fff}
.ts a:hover{color:#0a0a0a}
.ts a.ac:hover{color:#fff}
.fg{mb:10px}
.iwr{df:flex;ai:center;bg:#f5f5f7;bd:1px solid #e5e5ea;br:8px;transition:all .3s ease;p:0 12px;h:42px}
.iwr:focus-within{bd-color:#0a0a0a;bg:#f0f0f2}
.iwr .i{mr:8px;op:.4}
.iwr input{flex:1;p:8px 0;bg:transparent;bd:none;color:#0a0a0a;font-size:14px;outline:none;min-width:0}
.iwr input::placeholder{color:#999;font-size:13px}
.cr{df:flex;gap:8px;width:100%}
.cr .iwr{flex:1}
.cb{p:0 14px;bg:#0a0a0a;color:#fff;bd:none;br:8px;font-size:12px;fw:600;cursor:pointer;white-space:nowrap;transition:all .2s;fs:0;h:42px;df:flex;ai:center;jc:center}
.cb:hover{bg:#222}
.cb:disabled{bg:#555;color:#fff;cursor:not-allowed}
.bt{width:100%;h:36px;min-height:36px;line-height:36px;p:0 10px;bg:#0a0a0a;color:#fff;bd:none;br:8px;font-size:13px;fw:600;cursor:pointer;transition:background .3s ease;df:flex;ai:center;jc:center;gap:6px;mt:6px}
.bt:hover{bg:#222}
.bt:disabled{bg:#555;color:#fff;cursor:not-allowed}
</style>
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="ls"><img src="/svg/icon.svg" class="il"><div class="lt">T8000X网络</div></div>
<div class="ts"><a href="/login">登录</a><a class="ac" href="/register">注册</a></div>
<div class="fg"><div class="iwr"><img src="/svg/user.svg" class="i"><input type="text" id="regUsername" placeholder="请输入账号"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/lock.svg" class="i"><input type="password" id="regPassword" placeholder="请输入密码"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/email.svg" class="i"><input type="email" id="regEmail" placeholder="请输入邮箱"></div></div>
<div class="fg"><div class="cr"><div class="iwr"><img src="/svg/shield.svg" class="i"><input type="text" id="regCode" placeholder="邮箱验证码"></div><button class="cb" id="sendCodeBtn">获取验证码</button></div></div>
<button class="bt" id="registerBtn"><img src="/svg/register.svg" class="iw"> 注册</button>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){const $=id=>document.getElementById(id),u=$('regUsername'),p=$('regPassword'),e=$('regEmail'),c=$('regCode'),regBtn=$('registerBtn'),sendBtn=$('sendCodeBtn');let timer=null,seconds=0;
const api=async(url,method,body)=>{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const r=await fetch(url,opts);return await r.json()};
sendBtn.addEventListener('click',async()=>{const em=e.value.trim();if(!em){toast.error('请输入邮箱');return}sendBtn.disabled=true;sendBtn.textContent='发送中...';const r=await api('/api/send-code','POST',{email:em});if(r.success){toast.success('验证码已发送');seconds=60;sendBtn.textContent=seconds+'s';if(timer)clearInterval(timer);timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);sendBtn.textContent='获取验证码';sendBtn.disabled=false}else sendBtn.textContent=seconds+'s'},1000)}else{toast.error(r.error||'发送失败');sendBtn.disabled=false;sendBtn.textContent='获取验证码'}});
regBtn.addEventListener('click',async()=>{const un=u.value.trim(),pw=p.value.trim(),em=e.value.trim(),cd=c.value.trim();if(!un||!pw||!em||!cd){toast.error('请填写所有字段');return}regBtn.disabled=true;regBtn.innerHTML='<img src="/svg/loading.svg" class="iw sp"> 注册中...';const r=await api('/api/register','POST',{username:un,password:pw,email:em,code:cd});if(r.success){toast.success('注册成功！');regBtn.disabled=false;regBtn.innerHTML='<img src="/svg/register.svg" class="iw"> 注册';setTimeout(()=>{window.location.href='/login'},1000)}else{toast.error(r.error||'注册失败');regBtn.disabled=false;regBtn.innerHTML='<img src="/svg/register.svg" class="iw"> 注册'}})}();
</script>
</body>
</html>
