<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 聊天</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{width:100%;height:100%;background:#f8f9fa;overflow:hidden}
.container{width:100%;height:100%;display:flex;flex-direction:column;background:#f8f9fa}
.icon{display:inline-block;vertical-align:middle;flex-shrink:0;width:16px;height:16px;filter:brightness(0)saturate(100%)}
.icon-sm{width:14px;height:14px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.icon-md{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;filter:brightness(0)saturate(100%)}
.icon-gray{filter:brightness(0)saturate(0%)opacity(0.6)}
.spinner{animation:spin 1.5s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.header{padding:12px 16px;background:#0a0a0a;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.header .left{display:flex;align-items:center;gap:10px;cursor:pointer}
.header .left .header-avatar-icon{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;background:#e5e7eb;filter:brightness(0)saturate(0%)opacity(0.6)}
.header .left .header-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:none;display:block}
.header .left .header-username{font-size:16px;font-weight:600;color:#fff}
.header .right{display:flex;align-items:center;gap:12px}
.header .right .btn-icon{background:rgba(255,255,255,0.12);color:#fff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:15px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.header .right .btn-icon:hover{background:rgba(255,255,255,0.25)}
.header .right .btn-icon .label{font-size:13px;font-weight:500}
.header .right .btn-icon .icon-sm{filter:brightness(0)invert(1)}
.messages{flex:1;padding:16px 20px;overflow-y:auto;background:#f8f9fa}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:14px;gap:12px}
.loading-state .icon{width:32px;height:32px;filter:brightness(0)saturate(0%)opacity(0.4)}
.message{margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;max-width:100%}
.message.self{flex-direction:row-reverse}
.message .msg-avatar-wrapper{flex-shrink:0;width:36px;height:36px;border-radius:50%;overflow:hidden;background:#e5e7eb;cursor:pointer}
.message .msg-avatar-wrapper img{width:100%;height:100%;object-fit:cover;display:block}
.message .msg-avatar-wrapper .icon{width:36px;height:36px;filter:none;padding:6px;background:#e5e7eb}
.message .msg-content{display:flex;flex-direction:column;max-width:70%;min-width:0}
.message.self .msg-content{align-items:flex-end}
.message.other .msg-content{align-items:flex-start}
.message .sender{font-size:12px;color:#888;margin-bottom:2px;padding:0 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message .bubble{padding:10px 14px;border-radius:12px;font-size:14px;word-wrap:break-word;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;max-width:100%}
.message.self .bubble{background:#0a0a0a;color:#fff;border-bottom-right-radius:4px}
.message.other .bubble{background:#e9ecef;color:#333;border-bottom-left-radius:4px}
.message .bubble.image-only{background:transparent!important;padding:0!important;border-radius:0!important;color:inherit}
.message .bubble.image-only img{max-width:100%;max-height:400px;border-radius:8px;display:block;margin:4px 0}
.message .bubble img{max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;display:block}
.message .time{font-size:10px;color:#aaa;margin-top:2px;padding:0 4px}
.empty-state{text-align:center;color:#aaa;padding:40px 0;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state .icon{width:32px;height:32px;opacity:.3;filter:brightness(0)saturate(100%)}
.input-area{padding:12px 16px;border-top:1px solid #e5e5e5;display:flex;gap:8px;background:#fff;flex-shrink:0;align-items:flex-end}
.input-area textarea{flex:1;padding:10px 14px;border:1px solid #e5e5e5;border-radius:10px;font-size:14px;outline:none;resize:none;max-height:120px;min-height:44px;line-height:1.5;font-family:inherit;background:#f8f9fa;transition:border-color .2s}
.input-area textarea:focus{border-color:#0a0a0a;background:#fff}
.input-area .input-btn{height:44px;padding:0 14px;background:#f0f0f0;color:#333;border:1px solid #e5e5e5;border-radius:10px;cursor:pointer;font-size:16px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end}
.input-area .input-btn:hover{background:#e5e5e5}
.input-area .input-btn:disabled{opacity:.6;cursor:not-allowed}
.input-area .input-btn .icon-md{filter:brightness(0)saturate(100%)}
.input-area button.send-btn{padding:10px 20px;background:#0a0a0a;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s;display:flex;align-items:center;gap:6px;flex-shrink:0;height:44px;align-self:flex-end;white-space:nowrap}
.input-area button.send-btn:hover{background:#222}
.input-area button.send-btn:disabled{opacity:.7;cursor:not-allowed}
.input-area button.send-btn .icon-sm{filter:brightness(0)invert(1)}
.input-area .toggle-btn{transition:transform 0.3s ease}
.input-area .toggle-btn.rotated{transform:rotate(90deg)}
.function-panel{background:#fff;border-radius:0 0 10px 10px;margin:0 16px 12px 16px;padding:0 12px;max-height:0;opacity:0;overflow:hidden;transition:max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center}
.function-panel.open{max-height:200px;opacity:1;padding:12px 12px;overflow-y:auto}
.function-panel .func-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f9fa;border:1px solid #e5e5e5;border-radius:8px;padding:10px 0;cursor:pointer;transition:background .2s;font-size:12px;color:#333;gap:4px}
.function-panel .func-btn:hover{background:#e5e5e5}
.function-panel .func-btn .icon-md{width:24px;height:24px}
.announcement-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;display:flex;justify-content:center;align-items:center;padding:20px}
.announcement-overlay.hidden{display:none}
.announcement-modal{background:#fff;border-radius:16px;padding:24px 24px 16px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.3);text-align:center;position:relative}
.announcement-modal .title-line{border-top:2px solid #000;margin-bottom:16px;padding-top:8px}
.announcement-modal h2{font-size:20px;margin-bottom:12px;color:#0a0a0a;margin-top:0}
.announcement-modal .ann-content{font-size:15px;color:#333;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;line-height:1.6;max-height:200px;overflow-y:auto;text-align:left}
.announcement-modal .dismiss-row{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-bottom:14px}
.announcement-modal .dismiss-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:#000}
.announcement-modal .dismiss-row label{font-size:14px;color:#555;cursor:pointer}
.announcement-modal .btn-confirm{display:block;width:100%;padding:10px 0;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
.announcement-modal .btn-confirm:hover{background:#222}
.avatar-placeholder {width: 36px;height: 36px;border-radius: 50%;background: #e5e7eb;overflow: hidden;display: flex;align-items: center;justify-content: center;}
.avatar-placeholder img {width: 100%;height: 100%;object-fit: cover;filter: brightness(0) saturate(0%) opacity(0.6);}
.hidden-input {display: none;}
.load-more-indicator{text-align:center;padding:12px 0;color:#aaa;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.load-more-indicator .icon{width:18px;height:18px;filter:brightness(0)saturate(0%)opacity(0.6)}
.no-more{text-align:center;padding:12px 0;color:#bbb;font-size:13px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="left" id="headerProfileBtn">
<div id="headerAvatarContainer">
<div class="avatar-placeholder">
<img src="/svg/avatar.svg">
</div>
</div>
<span class="header-username" id="headerUsername">加载中...</span>
</div>
<div class="right"><button class="btn-icon" id="settingsBtn"><img src="/svg/gear.svg" class="icon-sm"><span class="label">设置</span></button></div>
</div>
<div class="messages" id="messagesContainer"><div class="loading-state" id="loadingIndicator"><img src="/svg/loading.svg" class="icon spinner"><span>加载中...</span></div></div>
<div class="input-area">
<button class="input-btn" id="imageBtn"><img src="/svg/img.svg" class="icon-md"></button>
<input type="file" id="imageInput" accept="image/*" class="hidden-input">
<textarea id="messageInput" placeholder="输入消息..." maxlength="500" rows="1"></textarea>
<button class="input-btn toggle-btn" id="togglePanelBtn"><img src="/svg/switch.svg" class="icon-md"></button>
<button class="send-btn" id="sendBtn"><img src="/svg/send.svg" class="icon-sm"> 发送</button>
</div>
<div class="function-panel" id="functionPanel">
<div class="func-btn" data-func="image"><img src="/svg/img.svg" class="icon-md"><span>图片</span></div>
<div class="func-btn" data-func="transfer"><img src="/svg/transfer.svg" class="icon-md"><span>转账</span></div>
<div class="func-btn" data-func="test"><img src="/svg/icon.svg" class="icon-md"><span>测试</span></div>
</div>
</div>
<div class="announcement-overlay hidden" id="announceOverlay">
<div class="announcement-modal"><div class="title-line"></div><h2 id="announceTitle">公告标题</h2><div class="ann-content" id="announceContent"></div><div class="dismiss-row"><input type="checkbox" id="announceDismiss"><label for="announceDismiss">不再弹出此公告</label></div><button class="btn-confirm" id="announceConfirm">确认</button></div>
</div>
<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<script src="/api/toast.js"></script>
<script>
!function(){const $=id=>document.getElementById(id),mc=$('messagesContainer'),mi=$('messageInput'),sb=$('sendBtn'),hu=$('headerUsername'),hac=$('headerAvatarContainer'),hpb=$('headerProfileBtn'),st=$('settingsBtn'),li=$('loadingIndicator'),ao=$('announceOverlay'),at=$('announceTitle'),ac=$('announceContent'),ad=$('announceDismiss'),acf=$('announceConfirm'),ib=$('imageBtn'),ii=$('imageInput'),tp=$('togglePanelBtn'),fp=$('functionPanel');let un='',pusher=null,channel=null,myAvatar=null,channelBound=!1,longPress=null,historyLoaded=!1,currentOffset=0,pageSize=50,hasMore=!0,isLoading=!1,firstLoad=!0;
function autoResize(){mi.style.height='auto';mi.style.height=Math.min(mi.scrollHeight,120)+'px'}mi.addEventListener('input',autoResize);
function decodeHtml(h){if(!h)return'';const t=document.createElement('textarea');t.innerHTML=h;return t.value}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>"']/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';if(m==='"')return'&quot;';if(m==="'")return'&#039;';return m})}
function compressImage(file,maxWidth=800,quality=0.7){return new Promise((resolve)=>{const r=new FileReader();r.onload=(e)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxWidth){h=h*maxWidth/w;w=maxWidth}c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob((blob)=>{resolve(new File([blob],file.name,{type:'image/jpeg'}))},'image/jpeg',quality)};img.src=e.target.result};r.readAsDataURL(file)})}
function renderContent(t){if(!t)return'';const m=t.match(/!\[.*?\]\((.*?)\)/);if(m){const u=escapeHtml(m[1]);return`<img src="${u}" loading="lazy" style="max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;" onerror="this.style.display='none'">`}return escapeHtml(t).replace(/\n/g,'<br>')}
function updateHeaderAvatar(url){if(url){hac.innerHTML=`<img class="header-avatar" src="${url}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:none;display:block;">`}else{hac.innerHTML=`<div class="avatar-placeholder"><img src="/svg/avatar.svg"></div>`}}
function getAvatarHtml(sender,avatarUrl,isSelf){const link=isSelf?'/profile':`/user?id=${encodeURIComponent(sender)}`;let inner=avatarUrl?`<img src="${avatarUrl}" draggable="false" oncontextmenu="return false;" style="width:100%;height:100%;object-fit:cover;">`:`<img src="/svg/avatar.svg" draggable="false" oncontextmenu="return false;" style="width:100%;height:100%;object-fit:cover;filter:brightness(0)saturate(0%)opacity(0.6)">`;return`<div class="msg-avatar-wrapper" data-sender="${sender}" data-link="${link}" oncontextmenu="return false;">${inner}</div>`}
function addMessage(sender,text,time,avatarUrl,isSelf,prepend){const ld=document.getElementById('loadingIndicator');if(ld)ld.remove();const emp=mc.querySelector('.empty-state');if(emp)emp.remove();const div=document.createElement('div');const self=isSelf!==undefined?isSelf:(sender===un);div.className='message '+(self?'self':'other');const ah=getAvatarHtml(sender,avatarUrl,self);div.innerHTML=`${ah}<div class="msg-content"><div class="sender"></div><div class="bubble"></div><div class="time"></div></div>`;const se=div.querySelector('.sender'),bu=div.querySelector('.bubble'),ti=div.querySelector('.time');const decoded=decodeHtml(text);se.textContent=sender;bu.innerHTML=renderContent(decoded);const trimmed=decoded.trim();if(/^!\[.*?\]\(.*?\)$/.test(trimmed))bu.classList.add('image-only');ti.textContent=time||'刚刚';if(prepend){mc.insertBefore(div,mc.firstChild)}else{mc.appendChild(div)}const wr=div.querySelector('.msg-avatar-wrapper');if(wr){wr.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false});wr.addEventListener('pointerdown',function(e){this._longPressTriggered=false;const target=this.dataset.sender||sender;longPress=setTimeout(()=>{if(target&&target!==un){const cur=mi.value,mention='@'+target+' ',pos=mi.selectionStart||0;mi.value=cur.slice(0,pos)+mention+cur.slice(pos);const newPos=pos+mention.length;mi.selectionStart=newPos;mi.selectionEnd=newPos;mi.focus();autoResize();toast.success('已@用户: '+target)}this._longPressTriggered=true;longPress=null},500)});wr.addEventListener('pointerup',function(e){if(longPress){clearTimeout(longPress);longPress=null;const link=this.dataset.link;if(link)window.location.href=link}});wr.addEventListener('pointerleave',function(){clearTimeout(longPress);longPress=null})}}
function showEmpty(){const ld=document.getElementById('loadingIndicator');if(ld)ld.remove();if(mc.querySelector('.empty-state'))return;const d=document.createElement('div');d.className='empty-state';d.innerHTML='<img src="/svg/chat.svg" class="icon"> 暂无消息';mc.appendChild(d)}
function showNoMore(){let el=mc.querySelector('.no-more');if(!el){el=document.createElement('div');el.className='no-more';el.textContent='没有内容了';mc.insertBefore(el,mc.firstChild)}}
function hideNoMore(){const el=mc.querySelector('.no-more');if(el)el.remove()}
function showLoadMore(){let el=mc.querySelector('.load-more-indicator');if(!el){el=document.createElement('div');el.className='load-more-indicator';el.innerHTML='<img src="/svg/loading.svg" class="icon spinner"> 加载消息中...';mc.insertBefore(el,mc.firstChild)}}
function hideLoadMore(){const el=mc.querySelector('.load-more-indicator');if(el)el.remove()}
function loadMessages(offset,prepend){if(isLoading)return Promise.resolve();isLoading=!0;let oldScrollTop=0,oldScrollHeight=0;if(prepend){showLoadMore();oldScrollTop=mc.scrollTop;oldScrollHeight=mc.scrollHeight;}const url='/api/messages?limit='+pageSize+'&offset='+offset;return fetch(url).then(r=>r.json()).then(d=>{if(prepend)hideLoadMore();if(d.success&&d.messages){if(d.messages.length===0){hasMore=false;if(offset===0){showEmpty()}else{showNoMore()}return}if(offset===0){mc.innerHTML='';d.messages.forEach(msg=>{const t=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un)});const saved=sessionStorage.getItem('chat_scroll_top');if(saved!==null&&!isNaN(saved)){mc.scrollTop=parseInt(saved,10);}else{mc.scrollTop=mc.scrollHeight;}}else{d.messages.forEach(msg=>{const t=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un,true)});const newScrollHeight=mc.scrollHeight;const delta=newScrollHeight-oldScrollHeight;mc.scrollTop=oldScrollTop+delta;}if(d.messages.length<pageSize){hasMore=false;if(offset!==0){showNoMore()}}else{hideNoMore()}}else{toast.error('加载消息失败')}}).catch(()=>{if(prepend)hideLoadMore();toast.error('网络错误')}).finally(()=>{isLoading=false;if(firstLoad){firstLoad=false;historyLoaded=true;toast.success('数据库连接成功')}})}
function loadHistory(){loadMessages(0,false)}
function handleNewMessage(msg){const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un);mc.scrollTop=mc.scrollHeight;}
function initPusher(){if(pusher&&channelBound)return;fetch('/api/pusher/config').then(r=>r.json()).then(d=>{if(!d.success){toast.error('连接聊天失败');return}pusher=new Pusher(d.key,{cluster:d.cluster});function bindOnce(){if(channelBound)return;if(!channel)channel=pusher.subscribe('chat');channel.bind('new-message',handleNewMessage);channelBound=true}pusher.connection.bind('state_change',function(states){if(states.current==='connected')bindOnce()});if(pusher.connection.state==='connected')bindOnce()}).catch(()=>{toast.error('连接聊天失败')})}
function sendMessage(){const text=mi.value.trim();if(!text)return;const isAi=un!=='纪失'&&text.startsWith('@纪失 ');let q='';if(isAi)q=text.substring(4).trim();sb.disabled=true;sb.innerHTML='<img src="/svg/loading.svg" class="icon-sm spinner"> 发送中...';mi.value='';autoResize();fetch('/api/send-message',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({content:text})}).then(r=>r.json()).then(d=>{if(!d.success){toast.error(d.error||'发送失败');sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="icon-sm"> 发送';return}if(isAi&&q){const delay=Math.floor(Math.random()*5000)+3000;setTimeout(()=>{fetch('/api/ai-ask',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:un,question:q})}).then(r=>r.json()).then(ad=>{if(!ad.success)toast.error('请求失败：'+(ad.error||'未知错误'))}).catch(()=>{toast.error('网络错误')})},delay)}}).catch(()=>{toast.error('发送失败')}).finally(()=>{sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="icon-sm"> 发送';mi.blur()})}
function checkAnnouncement(){fetch('/api/announcement').then(r=>r.json()).then(d=>{if(d.success){const stored=localStorage.getItem('announce_dismiss');const isDismissed=(stored===d.updated_at);if(d.is_active&&!isDismissed){toast.success('公告加载成功');at.textContent=d.title||'公告';ac.textContent=d.content||'';ad.checked=false;ao.classList.remove('hidden')}}}).catch(()=>{})}
acf.addEventListener('click',function(){toast.success('你已确认公告');if(ad.checked){fetch('/api/announcement').then(r=>r.json()).then(d=>{if(d.success&&d.updated_at)localStorage.setItem('announce_dismiss',d.updated_at)}).catch(()=>{})}ao.classList.add('hidden')});
ib.addEventListener('click',function(){ii.click()});
ii.addEventListener('change',async function(){let file=this.files[0];if(!file)return;if(file.size>200*1024){try{file=await compressImage(file,800,0.7)}catch(err){console.error(err);toast.error('图片压缩失败');this.value='';return}}if(file.size>7.5*1024*1024){toast.error('图片不能超过7.5MB');this.value='';return}ib.innerHTML='<img src="/svg/loading.svg" class="icon-sm spinner">';ib.disabled=true;const fd=new FormData();fd.append('image',file);try{const resp=await fetch('/api/upload-image',{method:'POST',body:fd,credentials:'include'});const data=await resp.json();if(data.success)toast.success('图片已发送');else toast.error(data.error||'上传失败')}catch(err){console.error(err);toast.error('网络错误，请重试')}finally{ib.innerHTML='<img src="/svg/img.svg" class="icon-md">';ib.disabled=false;this.value=''}});
tp.addEventListener('click',function(){const icon=this.querySelector('img');fp.classList.toggle('open');icon.classList.toggle('rotated')});
fp.querySelectorAll('.func-btn').forEach(function(btn){btn.addEventListener('click',function(){const type=this.dataset.func;if(type==='image')toast.success('测试1');else if(type==='transfer')toast.success('测试2');else if(type==='test')toast.success('测试3')})});
fetch('/api/user').then(r=>r.json()).then(d=>{if(d.success){un=d.username;hu.textContent=un;if(d.qq_number)myAvatar=`https://q1.qlogo.cn/g?b=qq&nk=${d.qq_number}&s=640`;else myAvatar=null;updateHeaderAvatar(myAvatar);loadHistory();initPusher();checkAnnouncement()}else window.location.href='/login'}).catch(()=>{window.location.href='/login'});
sb.addEventListener('click',sendMessage);hpb.addEventListener('click',()=>{window.location.href='/profile'});st.addEventListener('click',()=>{window.location.href='/profile'});
mc.addEventListener('scroll',function(){if(this.scrollTop===0&&hasMore&&!isLoading&&!firstLoad){currentOffset+=pageSize;loadMessages(currentOffset,true)}sessionStorage.setItem('chat_scroll_top',this.scrollTop.toString())});
}();
</script>
</body>
</html>
