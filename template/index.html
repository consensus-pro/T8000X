<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 聊天</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/template/style.css">
</head>
<body>
<div class="ct">
<div class="hd">
<div class="lf" id="headerProfileBtn">
<div id="headerAvatarContainer"><div class="ap"><img src="/svg/avatar.svg"></div></div>
<span class="hu" id="headerUsername">加载中...</span>
</div>
<div class="rg"><button class="bi" id="settingsBtn"><img src="/svg/gear.svg" class="is"><span class="lb">设置</span></button></div>
</div>
<div class="ms" id="messagesContainer"><div class="ls" id="loadingIndicator"><img src="/svg/loading.svg" class="i sp"><span>加载中...</span></div></div>
<div class="ia">
<textarea id="messageInput" placeholder="输入消息..." maxlength="1000" rows="1"></textarea>
<button class="pb" id="plusBtn"><img src="/svg/plus.svg" class="pi"></button>
<button class="sb" id="sendBtn"><img src="/svg/send.svg" class="is"> 发送</button>
</div>
<div class="fp" id="functionPanel">
<div class="fi" id="funcUpload"><img src="/svg/img.svg" class="fi2" id="funcIcon1"><span class="fl" id="funcLabel1">图片</span></div>
<div class="fi" id="funcAI"><img src="/svg/code.svg" class="fi2"><span class="fl">调用AI</span></div>
<div class="fi" data-func="3"><img src="/svg/time.svg" class="fi2"><span class="fl">测试3</span></div>
<div class="fi" data-func="4"><img src="/svg/time.svg" class="fi2"><span class="fl">测试4</span></div>
</div>
</div>
<div class="ao hd2" id="announceOverlay">
<div class="am"><div class="tl"></div><h2 id="announceTitle">公告标题</h2><div class="ac2" id="announceContent"></div><div class="dr"><input type="checkbox" id="announceDismiss"><label for="announceDismiss">不再弹出此公告</label></div><button class="bc2" id="announceConfirm">确认</button></div>
</div>
<input type="file" id="imageInput" accept="image/*" class="hi">
<template id="tpl-message"><div class="msg"><div class="aw"><img src="" data-field="avatar"></div><div class="mc"><div class="sn" data-field="username"></div><div class="bb" data-field="content"></div><div class="tm" data-field="time"></div></div></div></template>
<template id="tpl-loading-indicator"><div class="ls" id="loadingIndicator"><img src="/svg/loading.svg" class="i sp"><span>加载中...</span></div></template>
<template id="tpl-empty-messages"><div class="ep"><img src="/svg/chat.svg" class="i"> 暂无消息</div></template>
<template id="tpl-no-more"><div class="nm">没有内容了</div></template>
<template id="tpl-load-more"><div class="lm"><img src="/svg/loading.svg" class="i sp"> 加载消息中...</div></template>
<template id="tpl-code-block"><div class="cb"><div class="ch"><span class="cl" data-field="lang">text</span><span class="ca"><button class="code-copy"><img src="/svg/copy.svg" class="cci"> 复制</button><button class="code-run"><img src="/svg/code.svg" class="cri"> 运行</button></span></div><div class="cb2"><code class="hljs" data-field="code"></code></div></div></template>
<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<script src="/api/toast.js"></script>
<script>
"use strict";
function cloneTemplate(id){const tpl=document.getElementById(id);return tpl.content.cloneNode(true);}
function escapeHtml(s){if(!s)return'';return s.replace(/[&<>"']/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';if(m==='"')return'&quot;';if(m==="'")return'&#039;';return m;});}
function decodeHtml(h){if(!h)return'';const t=document.createElement('textarea');t.innerHTML=h;return t.value;}
function compressImage(file,maxWidth,quality){maxWidth=maxWidth||800;quality=quality||0.7;return new Promise(function(resolve){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var w=img.width,h=img.height;if(w>maxWidth){h=h*maxWidth/w;w=maxWidth;}c.width=w;c.height=h;var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob(function(blob){resolve(new File([blob],file.name,{type:'image/jpeg'}));},'image/jpeg',quality);};img.src=e.target.result;};r.readAsDataURL(file);});}
function urlify(text){var urlRegex=/(https?:\/\/[^\s]+)/g;return text.replace(urlRegex,function(url){return'<a href="'+url+'" target="_blank" rel="noopener noreferrer" style="color:#1677ff;text-decoration:underline;word-break:break-all;">'+url+'</a>';});}
function getAvatarUrl(qq){return qq?'https://q1.qlogo.cn/g?b=qq&nk='+qq+'&s=640':null;}
function autoResizeTextarea(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
var $=function(id){return document.getElementById(id);};
var mc=$('messagesContainer'),mi=$('messageInput'),sb=$('sendBtn'),hu=$('headerUsername'),hac=$('headerAvatarContainer'),hpb=$('headerProfileBtn'),st=$('settingsBtn'),li=$('loadingIndicator'),ao=$('announceOverlay'),at=$('announceTitle'),ac=$('announceContent'),ad=$('announceDismiss'),acf=$('announceConfirm'),ii=$('imageInput'),pb=$('plusBtn'),fp=$('functionPanel'),pi=pb.querySelector('.pi'),fu=$('funcUpload'),fIcon=$('funcIcon1'),fLabel=$('funcLabel1'),funcAI=$('funcAI');
var un='',pusher=null,channel=null,myAvatar=null,channelBound=false,longPress=null,historyLoaded=false,currentOffset=0,pageSize=50,hasMore=true,isLoading=false,firstLoad=true,isUploading=false,isAiPending=false;
function renderMessage(sender,text,time,avatarUrl,isSelf){var clone=cloneTemplate('tpl-message');var msgDiv=clone.querySelector('.msg');var avatarImg=clone.querySelector('[data-field="avatar"]');var usernameEl=clone.querySelector('[data-field="username"]');var contentEl=clone.querySelector('[data-field="content"]');var timeEl=clone.querySelector('[data-field="time"]');if(isSelf)msgDiv.classList.add('sf');else msgDiv.classList.add('ot');if(avatarUrl){avatarImg.src=avatarUrl;}else{avatarImg.src='/svg/avatar.svg';}usernameEl.textContent=sender;timeEl.textContent=time||'刚刚';var decoded=decodeHtml(text);var rendered=renderContent(decoded);contentEl.innerHTML=rendered;if(/^!\[.*?\]\(.*?\)$/.test(decoded.trim())){contentEl.classList.add('io');}var codeEl=contentEl.querySelector('code');if(codeEl&&typeof hljs!=='undefined'){hljs.highlightElement(codeEl);}var aw=msgDiv.querySelector('.aw');aw.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();return false;});aw.addEventListener('pointerdown',function(e){this._longPressTriggered=false;var target=this.dataset.sender||sender;longPress=setTimeout(function(){if(target&&target!==un){var cur=mi.value;var mention='@'+target+' ';var pos=mi.selectionStart||0;mi.value=cur.slice(0,pos)+mention+cur.slice(pos);var newPos=pos+mention.length;mi.selectionStart=newPos;mi.selectionEnd=newPos;mi.focus();autoResizeTextarea(mi);toast.success('已@用户: '+target);}this._longPressTriggered=true;longPress=null;}.bind(this),500);});aw.addEventListener('pointerup',function(e){if(longPress){clearTimeout(longPress);longPress=null;var link=this.dataset.link;if(link)window.location.href=link;}});aw.addEventListener('pointerleave',function(){clearTimeout(longPress);longPress=null;});return clone;}
function renderContent(text){if(!text)return'';var imgMatch=text.match(/!\[.*?\]\((.*?)\)/);if(imgMatch){var u=escapeHtml(imgMatch[1]);return'<img src="'+u+'" loading="lazy" style="max-width:100%;max-height:250px;border-radius:8px;margin:4px 0;" onerror="this.style.display=\'none\'">';}var codeBlockRegex=/(```)(\w+)?\n([\s\S]*?)\n\1/g;var result=text;var parts=[];var lastIndex=0;var match;while((match=codeBlockRegex.exec(text))!==null){var before=text.substring(lastIndex,match.index);if(before)parts.push(urlify(escapeHtml(before)).replace(/\n/g,'<br>'));var lang=match[2]||'text';var code=match[3];parts.push(renderCodeBlock(lang,code));lastIndex=codeBlockRegex.lastIndex;}if(lastIndex<text.length){parts.push(urlify(escapeHtml(text.substring(lastIndex))).replace(/\n/g,'<br>'));}return parts.join('');}
function renderCodeBlock(lang,code){var clone=cloneTemplate('tpl-code-block');var langEl=clone.querySelector('[data-field="lang"]');var codeEl=clone.querySelector('[data-field="code"]');langEl.textContent=lang||'text';codeEl.textContent=code;codeEl.className='hljs language-'+(lang||'text');return clone;}
function renderLoadingIndicator(){var clone=cloneTemplate('tpl-loading-indicator');return clone;}
function renderEmptyMessages(){var clone=cloneTemplate('tpl-empty-messages');return clone;}
function renderNoMore(){var clone=cloneTemplate('tpl-no-more');return clone;}
function renderLoadMore(){var clone=cloneTemplate('tpl-load-more');return clone;}
function updateHeaderAvatar(url){if(url){hac.innerHTML='<img class="ha2" src="'+url+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:none;display:block;">';}else{hac.innerHTML='<div class="ap"><img src="/svg/avatar.svg"></div>';}}
function addMessage(sender,text,time,avatarUrl,isSelf,prepend){var ld=document.getElementById('loadingIndicator');if(ld)ld.remove();var emp=mc.querySelector('.ep');if(emp)emp.remove();var self=(isSelf!==undefined)?isSelf:(sender===un);var clone=renderMessage(sender,text,time,avatarUrl,self);var msgDiv=clone.querySelector('.msg');var aw=msgDiv.querySelector('.aw');var link=self?'/profile':'/user?id='+encodeURIComponent(sender);aw.dataset.link=link;aw.dataset.sender=sender;if(prepend){mc.insertBefore(clone,mc.firstChild);}else{mc.appendChild(clone);}var codeEl=msgDiv.querySelector('code');if(codeEl&&typeof hljs!=='undefined'){hljs.highlightElement(codeEl);}}
function showEmpty(){var ld=document.getElementById('loadingIndicator');if(ld)ld.remove();if(mc.querySelector('.ep'))return;mc.appendChild(renderEmptyMessages());}
function showNoMore(){var el=mc.querySelector('.nm');if(!el){mc.insertBefore(renderNoMore(),mc.firstChild);}}
function hideNoMore(){var el=mc.querySelector('.nm');if(el)el.remove();}
function showLoadMore(){var el=mc.querySelector('.lm');if(!el){mc.insertBefore(renderLoadMore(),mc.firstChild);}}
function hideLoadMore(){var el=mc.querySelector('.lm');if(el)el.remove();}
function loadMessages(offset,prepend){if(isLoading)return Promise.resolve();isLoading=true;var oldScrollTop=0;var oldScrollHeight=0;if(prepend){showLoadMore();oldScrollTop=mc.scrollTop;oldScrollHeight=mc.scrollHeight;}var url='/api/messages?limit='+pageSize+'&offset='+offset;return fetch(url,{credentials:'include'}).then(function(r){return r.json();}).then(function(d){if(prepend)hideLoadMore();if(d.success&&d.messages){if(d.messages.length===0){hasMore=false;if(offset===0){showEmpty();}else{showNoMore();}return;}if(offset===0){mc.innerHTML='';d.messages.forEach(function(msg){var t=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un);});mc.scrollTop=mc.scrollHeight;}else{d.messages.forEach(function(msg){var t=new Date(msg.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un,true);});var newScrollHeight=mc.scrollHeight;var delta=newScrollHeight-oldScrollHeight;mc.scrollTop=oldScrollTop+delta;}if(d.messages.length<pageSize){hasMore=false;if(offset!==0){showNoMore();}}else{hideNoMore();}}else{toast.error('加载消息失败');}}).catch(function(){if(prepend)hideLoadMore();toast.error('网络错误');}).finally(function(){isLoading=false;if(firstLoad){firstLoad=false;historyLoaded=true;toast.success('数据库连接成功');}});}
function loadHistory(){return loadMessages(0,false);}
function handleNewMessage(msg){var t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});addMessage(msg.username,msg.content,t,msg.avatar_url,msg.username===un);mc.scrollTop=mc.scrollHeight;}
function initPusher(){if(pusher&&channelBound)return;fetch('/api/pusher/config',{credentials:'include'}).then(function(r){return r.json();}).then(function(d){if(!d.success){toast.error('连接聊天失败');return;}pusher=new Pusher(d.key,{cluster:d.cluster});function bindOnce(){if(channelBound)return;if(!channel)channel=pusher.subscribe('chat');channel.bind('new-message',handleNewMessage);channelBound=true;}pusher.connection.bind('state_change',function(states){if(states.current==='connected')bindOnce();});if(pusher.connection.state==='connected')bindOnce();}).catch(function(){toast.error('连接聊天失败');});}
function checkAnnouncement(){fetch('/api/announcement',{credentials:'include'}).then(function(r){return r.json();}).then(function(d){if(d.success){var stored=localStorage.getItem('announce_dismiss');var isDismissed=(stored===d.updated_at);if(d.is_active&&!isDismissed){toast.success('公告加载成功');at.textContent=d.title||'公告';ac.textContent=d.content||'';ad.checked=false;ao.classList.remove('hd2');}}}).catch(function(){});}
acf.addEventListener('click',function(){toast.success('你已确认公告');if(ad.checked){fetch('/api/announcement',{credentials:'include'}).then(function(r){return r.json();}).then(function(d){if(d.success&&d.updated_at){localStorage.setItem('announce_dismiss',d.updated_at);}}).catch(function(){});}ao.classList.add('hd2');});
function sendMessage(){var text=mi.value.trim();if(!text)return;var isAi=(un!=='纪失'&&text.startsWith('@纪失 '));var q='';if(isAi)q=text.substring(4).trim();sb.disabled=true;sb.innerHTML='<img src="/svg/loading.svg" class="is sp"> 发送中...';mi.value='';autoResizeTextarea(mi);fetch('/api/send-message',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({content:text})}).then(function(r){return r.json();}).then(function(d){if(!d.success){toast.error(d.error||'发送失败');sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="is"> 发送';return;}if(isAi&&q&&!isAiPending){isAiPending=true;var delay=Math.floor(Math.random()*3000)+2000;setTimeout(function(){fetch('/api/ai-ask',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:un,question:q})}).then(function(r){return r.json();}).then(function(ad){if(!ad.success)toast.error('请求失败：'+(ad.error||'未知错误'));}).catch(function(){toast.error('网络错误');}).finally(function(){isAiPending=false;});},delay);}}).catch(function(){toast.error('发送失败');}).finally(function(){sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="is"> 发送';mi.blur();});}
ii.addEventListener('change',function(){var file=this.files[0];if(!file)return;if(isUploading)return;if(file.size>200*1024){compressImage(file,800,0.7).then(function(compressed){doUpload(compressed);}).catch(function(){toast.error('图片压缩失败');this.value='';}.bind(this));return;}doUpload(file);});
function doUpload(file){if(file.size>7.5*1024*1024){toast.error('图片不能超过7.5MB');ii.value='';return;}isUploading=true;fIcon.src='/svg/loading.svg';fIcon.classList.add('sp');fLabel.textContent='上传中...';var fd=new FormData();fd.append('image',file);fetch('/api/upload-image',{method:'POST',body:fd,credentials:'include'}).then(function(r){return r.json();}).then(function(data){if(data.success)toast.success('图片已发送');else toast.error(data.error||'上传失败');}).catch(function(){toast.error('网络错误，请重试');}).finally(function(){fIcon.src='/svg/img.svg';fIcon.classList.remove('sp');fLabel.textContent='图片';isUploading=false;ii.value='';});}
function copyCode(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast.success('代码已复制');}).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';ta.style.left='-9999px';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast.success('代码已复制');}catch(e){toast.error('复制失败，请手动复制');}document.body.removeChild(ta);}
mc.addEventListener('click',function(e){var target=e.target.closest('.code-copy');if(target){var block=target.closest('.cb');var codeEl=block.querySelector('.cb2 code');var text=codeEl.textContent;copyCode(text);e.preventDefault();return;}var runTarget=e.target.closest('.code-run');if(runTarget){var block=runTarget.closest('.cb');var codeEl=block.querySelector('.cb2 code');var text=codeEl.textContent;var newWin=window.open('','_blank');if(newWin){newWin.document.write(text);var titleMatch=text.match(/<title>(.*?)<\/title>/i);if(titleMatch&&titleMatch[1]){newWin.document.title=titleMatch[1];}newWin.document.close();}else{toast.error('请允许弹出窗口');}e.preventDefault();}});
mi.addEventListener('input',function(){autoResizeTextarea(this);});
sb.addEventListener('click',sendMessage);
mi.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
hpb.addEventListener('click',function(){window.location.href='/profile';});
st.addEventListener('click',function(){window.location.href='/profile';});
mc.addEventListener('scroll',function(){if(this.scrollTop===0&&hasMore&&!isLoading&&!firstLoad){currentOffset+=pageSize;loadMessages(currentOffset,true);}sessionStorage.setItem('chat_scroll_top',this.scrollTop.toString());});
pb.addEventListener('click',function(){pi.classList.toggle('rt');fp.classList.toggle('op');});
fu.addEventListener('click',function(){if(isUploading)return;ii.click();});
fp.querySelectorAll('.fi:not(#funcUpload):not(#funcAI)').forEach(function(item){item.addEventListener('click',function(){var num=this.dataset.func;toast.success('测试'+num);});});
funcAI.addEventListener('click',function(){toast.success('已@纪失 请输入调用内容');mi.value='@纪失 ';mi.focus();autoResizeTextarea(mi);});
mi.addEventListener('focus',function(){if(fp.classList.contains('op')){fp.classList.remove('op');pi.classList.remove('rt');}});
fetch('/api/user',{credentials:'include'}).then(function(r){return r.json();}).then(function(d){if(d.success){un=d.username;hu.textContent=un;if(d.qq_number){myAvatar='https://q1.qlogo.cn/g?b=qq&nk='+d.qq_number+'&s=640';}else{myAvatar=null;}updateHeaderAvatar(myAvatar);loadHistory();initPusher();checkAnnouncement();}else{window.location.href='/login';}}).catch(function(){window.location.href='/login';});
</script>
</body>
</html>
