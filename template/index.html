function sendMessage(){const text=mi.value.trim();if(!text)return;const isAi=un!=='纪失'&&text.startsWith('@纪失 ');let q='';if(isAi)q=text.substring(4).trim();sb.disabled=true;sb.innerHTML='<img src="/svg/loading.svg" class="is sp"> 发送中...';mi.value='';autoResize();fetch('/api/send-message',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({content:text})}).then(r=>r.json()).then(d=>{if(!d.success){toast.error(d.error||'发送失败');sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="is"> 发送';return}if(isAi&&q&&!isAiPending){isAiPending=true;const delay=Math.floor(Math.random()*3000)+2000;setTimeout(()=>{fetch('/api/ai-ask',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:un,question:q})}).then(r=>r.json()).then(ad=>{if(!ad.success)toast.error('请求失败：'+(ad.error||'未知错误'))}).catch(()=>{toast.error('网络错误')}).finally(()=>{isAiPending=false})},delay)}}).catch(()=>{toast.error('发送失败')}).finally(()=>{sb.disabled=false;sb.innerHTML='<img src="/svg/send.svg" class="is"> 发送';mi.blur()})}

acf.addEventListener('click',function(){toast.success('你已确认公告');if(ad.checked){fetch('/api/announcement').then(r=>r.json()).then(d=>{if(d.success&&d.updated_at)localStorage.setItem('announce_dismiss',d.updated_at)}).catch(()=>{})}ao.classList.add('hd2')});
ii.addEventListener('change',async function(){let file=this.files[0];if(!file)return;if(isUploading)return;if(file.size>200*1024){try{file=await compressImage(file,800,0.7)}catch(err){console.error(err);toast.error('图片压缩失败');this.value='';return}}if(file.size>7.5*1024*1024){toast.error('图片不能超过7.5MB');this.value='';return}isUploading=true;fIcon.src='/svg/loading.svg';fIcon.classList.add('sp');fLabel.textContent='上传中...';const fd=new FormData();fd.append('image',file);try{const resp=await fetch('/api/upload-image',{method:'POST',body:fd,credentials:'include'});const data=await resp.json();if(data.success)toast.success('图片已发送');else toast.error(data.error||'上传失败')}catch(err){console.error(err);toast.error('网络错误，请重试')}finally{fIcon.src='/svg/img.svg';fIcon.classList.remove('sp');fLabel.textContent='图片';isUploading=false;this.value=''}});
fetch('/api/user').then(r=>r.json()).then(d=>{if(d.success){un=d.username;hu.textContent=un;if(d.qq_number)myAvatar='https://q1.qlogo.cn/g?b=qq&nk='+d.qq_number+'&s=640';else myAvatar=null;updateHeaderAvatar(myAvatar);loadHistory();initPusher();checkAnnouncement()}else window.location.href='/login'}).catch(()=>{window.location.href='/login'});
sb.addEventListener('click',sendMessage);hpb.addEventListener('click',()=>{window.location.href='/profile'});st.addEventListener('click',()=>{window.location.href='/profile'});
mc.addEventListener('scroll',function(){if(this.scrollTop===0&&hasMore&&!isLoading&&!firstLoad){currentOffset+=pageSize;loadMessages(currentOffset,true)}sessionStorage.setItem('chat_scroll_top',this.scrollTop.toString())});
pb.addEventListener('click',function(){pi.classList.toggle('rt');fp.classList.toggle('op')});
fu.addEventListener('click',function(){if(isUploading)return;ii.click()});
fp.querySelectorAll('.fi:not(#funcUpload):not(#funcAI)').forEach(function(item){item.addEventListener('click',function(){const num=this.dataset.func;toast.success('测试'+num)})});
funcAI.addEventListener('click',function(){toast.success('已@纪失 请输入调用内容');mi.value='@纪失 ';mi.focus();autoResize()});
mi.addEventListener('focus',function(){if(fp.classList.contains('op')){fp.classList.remove('op');pi.classList.remove('rt')}});
mc.addEventListener('click',function(e){var target=e.target.closest('.code-copy');if(target){var block=target.closest('.cb');var codeEl=block.querySelector('.cb2 code');var text=codeEl.textContent;copyCode(text);e.preventDefault();return}var runTarget=e.target.closest('.code-run');if(runTarget){var block=runTarget.closest('.cb');var codeEl=block.querySelector('.cb2 code');var text=codeEl.textContent;var newWin=window.open('','_blank');if(newWin){newWin.document.write(text);var titleMatch=text.match(/<title>(.*?)<\/title>/i);if(titleMatch&&titleMatch[1]){newWin.document.title=titleMatch[1];}newWin.document.close();}else{toast.error('请允许弹出窗口');}e.preventDefault();}});
}();
