<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 用户主页</title>
<link rel="stylesheet" href="/template/style.css">
</head>
<body>
<div class="bg"></div>
<div class="c">
<div id="loadingIndicator" class="ls2"><img src="/svg/loading.svg" class="i sp"><span>加载中...</span></div>
<div id="normalContent" class="hi pc">
<div class="as"><div id="ac"></div></div>
<div class="ti" id="pageTitle"><img src="/svg/user.svg" class="i"> 用户资料</div>
<div class="sb"><div class="si"><div class="nu" id="rankDisplay">--</div><div class="lb"><img src="/svg/ranking.svg" class="is">排名</div></div><div class="si"><div class="nu" id="pointsDisplay">0</div><div class="lb"><img src="/svg/coins.svg" class="is">积分</div></div></div>
<div class="ib">
<p><img src="/svg/user.svg" class="i">账号：<span id="profileUsername">––</span></p>
<p><img src="/svg/sign.svg" class="i">签名：<span id="userSignature">––</span></p>
<p><img src="/svg/gender.svg" class="i">性别：<span id="userGender">––</span></p>
<p><img src="/svg/email.svg" class="i">邮箱：<span id="profileEmail">––</span></p>
<p><img src="/svg/time.svg" class="i">注册时间：<span id="profileCreatedAt">––</span></p>
<p><img src="/svg/qq.svg" class="ig">绑定QQ：<span id="profileQQ">--</span></p>
</div>
<button class="bb2" id="backBtn"><img src="/svg/return.svg" class="i"> 返回聊天</button>
</div>
<div id="errorContainer" class="hi"><img src="/svg/data.svg" class="ei"><h1 class="et">用户不存在</h1><button class="eb" id="errorBackBtn"><img src="/svg/return.svg" class="i"> 返回聊天</button></div>
<div id="searchContainer" class="hi" style="width:100%;">
<div class="scard">
<div class="sh">
<h3><img src="/svg/net.svg" class="i" style="width:20px;height:20px;"> 查询用户</h3>
<div class="ss">输入用户名进行搜索</div>
</div>
<div class="sr2">
<div class="ib2">
<input type="text" id="searchUsername" placeholder="账号" autofocus>
</div>
<button class="bs3" id="searchBtn">
<img src="/svg/search.svg">
</button>
</div>
</div>
</div>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){
var $=id=>document.getElementById(id);
var L=$('loadingIndicator'),N=$('normalContent'),E=$('errorContainer'),S=$('searchContainer');
var U=$('profileUsername'),M=$('profileEmail'),G=$('userSignature'),X=$('userGender'),T=$('profileCreatedAt'),Q=$('profileQQ');
var A=$('ac'),R=$('rankDisplay'),P=$('pointsDisplay');
var B=$('backBtn'),F=$('errorBackBtn'),H=$('pageTitle');
var Ipt=$('searchUsername'),Btn=$('searchBtn');
var api=async(u,m,b)=>{try{var o={method:m||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(b)o.body=JSON.stringify(b);var r=await fetch(u,o);return await r.json()}catch(_){return{success:!1,error:'网络连接失败'}}};
function gc(g){if(g==='男')return '#1677ff';if(g==='女')return '#ff69b4';if(g==='其他')return '#ffc107';return '#888'}
function ua(q,g){var c=gc(g);A.style.borderColor=c;A.classList.remove('da','qa');A.style.backgroundImage='';A.style.backgroundColor='';A.innerHTML='';if(q){A.classList.add('qa');A.style.backgroundImage='url(https://q1.qlogo.cn/g?b=qq&nk='+q+'&s=640)';A.style.backgroundSize='cover';A.innerHTML='<img src="/svg/avatar.svg" style="display:none;">'}else{A.classList.add('da');A.innerHTML='<img src="/svg/avatar.svg">'}}
function se(){L.classList.add('hi');N.classList.add('hi');E.classList.remove('hi');S.classList.add('hi')}
function sc(d){L.classList.add('hi');E.classList.add('hi');S.classList.add('hi');N.classList.remove('hi');U.textContent=d.username;M.textContent=d.email;var p=d.total_points||0;P.textContent=p;R.textContent=(p>0&&d.rank)?'#'+d.rank:'未上榜';var s=d.signature||'未填写';G.textContent=s;G.classList.toggle('gt',s==='未填写');var g=d.gender||'不愿透露';X.textContent=g;X.classList.toggle('gt',g==='不愿透露');T.textContent=d.created_at||'未知';var q=d.qq_number||'未绑定';Q.textContent=q;Q.classList.toggle('gt',q==='未绑定');H.innerHTML='<img src="/svg/user.svg" class="i"> '+d.username+' 的主页';ua(d.qq_number,g);toast.success('账号信息加载成功')}
function sh(){L.classList.add('hi');N.classList.add('hi');E.classList.add('hi');S.classList.remove('hi');document.title='T8000X - 用户搜索';Ipt.focus()}
async function lp(){var p=new URLSearchParams(window.location.search),u=p.get('id');if(!u){sh();return}L.classList.remove('hi');N.classList.add('hi');E.classList.add('hi');S.classList.add('hi');var r=await api('/api/user?username='+encodeURIComponent(u),'GET');if(!r.success||r.error==='用户不存在'){se();return}sc(r)}
Btn.addEventListener('click',function(){var v=Ipt.value.trim();if(!v){toast.error('请输入用户名');return}window.location.href='/user?id='+encodeURIComponent(v)});
Ipt.addEventListener('keydown',function(e){if(e.key==='Enter')Btn.click()});
B.addEventListener('click',()=>{window.location.href='/'});
F.addEventListener('click',()=>{window.location.href='/'});
lp();
}();
</script>
</body>
</html>
