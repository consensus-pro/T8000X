<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 登录</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/template/style.css">
</head>
<body class="l">
<div class="bg"></div>
<div class="c">
<div class="ls"><img src="/svg/icon.svg" class="il"><div class="lt">T8000X网络</div></div>
<div class="ts"><a class="ac" href="/login">登录</a><a href="/register">注册</a></div>
<div class="fg"><div class="iwr"><img src="/svg/user.svg" class="i"><input type="text" id="loginUsername" placeholder="请输入账号"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/lock.svg" class="i"><input type="password" id="loginPassword" placeholder="请输入密码"></div></div>
<div class="fg">
<div class="captcha-row">
<div class="input-wrapper"><i class="fas fa-shield-alt"></i><input type="text" id="loginCaptcha" placeholder="验证码" maxlength="5" autocomplete="off"></div>
<div class="captcha-img-wrap" onclick="refreshCaptcha()"><img id="captchaImg" src="" alt="验证码"></div>
</div>
</div>
<button class="bt" id="loginBtn"><img src="/svg/enter.svg" class="iw"> 登录</button>
</div>
<script src="/api/toast.js"></script>
<script>
let captchaToken='';
async function refreshCaptcha(){try{const resp=await fetch('/api/captcha');const data=await resp.json();if(data.code===0){document.getElementById('captchaImg').src=data.data.image;captchaToken=data.data.captcha_token;}else{toast.error('验证码加载失败');}}catch(e){toast.error('网络错误，请重试');}}
!function(){const $=id=>document.getElementById(id);const u=$('loginUsername'),p=$('loginPassword'),c=$('loginCaptcha'),btn=$('loginBtn');const api=async(url,method,body)=>{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const r=await fetch(url,opts);return await r.json();};btn.addEventListener('click',async ()=>{const un=u.value.trim(),pw=p.value.trim(),ca=c.value.trim();if(!un||!pw){toast.error('请填写账号和密码');return;}if(!ca){toast.error('请输入验证码');return;}if(!captchaToken){toast.error('验证码未加载，请点击刷新');return;}btn.disabled=true;btn.innerHTML='<img src="/svg/loading.svg" class="iw sp"> 登录中...';const r=await api('/api/login','POST',{username:un,password:pw,captcha:ca,captcha_token:captchaToken});if(r.success){toast.success(r.message);setTimeout(()=>{window.location.href='/';},600);}else{toast.error(r.error||'登录失败');btn.disabled=false;btn.innerHTML='<img src="/svg/enter.svg" class="iw"> 登录';refreshCaptcha();}});p.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});refreshCaptcha();}();
</script>
</body>
</html>
