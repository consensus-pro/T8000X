<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T8000X - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;position:relative}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(0,0,0,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.03)1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
.c{width:100%;max-width:340px;margin:0 auto;position:relative;z-index:1;padding:20px 0}
.i,.iw{width:16px;height:16px;display:inline-block;vertical-align:middle;flex-shrink:0}
.i{filter:brightness(0)saturate(100%)}
.iw{filter:brightness(0)invert(1)}
.il{width:48px;height:48px;display:block;margin:0 auto 6px;filter:brightness(0)saturate(100%)}
.sp{animation:spn 1s linear infinite;display:inline-block}
@keyframes spn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ls{text-align:center;margin-bottom:18px}
.ls .lt{font-size:18px;font-weight:700;color:#0a0a0a;letter-spacing:.5px}
.ts{display:flex;gap:0;margin-bottom:18px;background:#f0f0f0;border-radius:8px;padding:3px}
.ts a{flex:1;padding:7px 0;text-align:center;background:transparent;color:#888;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;transition:all .3s ease;text-decoration:none}
.ts a.ac{background:#0a0a0a;color:#fff}
.ts a:hover{color:#0a0a0a}
.ts a.ac:hover{color:#fff}
.fg{margin-bottom:10px}
.iwr{display:flex;align-items:center;background:#f5f5f7;border:1px solid #e5e5ea;border-radius:8px;transition:all .3s ease;padding:0 12px;height:42px}
.iwr:focus-within{border-color:#0a0a0a;background:#f0f0f2}
.iwr .i{margin-right:8px;opacity:.4}
.iwr input{flex:1;padding:8px 0;background:transparent;border:none;color:#0a0a0a;font-size:14px;outline:none;min-width:0}
.iwr input::placeholder{color:#999;font-size:13px}
.bt{width:100%;height:36px;min-height:36px;line-height:36px;padding:0 10px;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .3s ease;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.bt:hover{background:#222}
.bt:disabled{background:#555;color:#fff;cursor:not-allowed}
</style>
</head>
<body>
<div class="bg"></div>
<div class="c">
<div class="ls"><img src="/svg/icon.svg" class="il"><div class="lt">T8000X网络</div></div>
<div class="ts"><a class="ac" href="/login">登录</a><a href="/register">注册</a></div>
<div class="fg"><div class="iwr"><img src="/svg/user.svg" class="i"><input type="text" id="loginUsername" placeholder="请输入账号"></div></div>
<div class="fg"><div class="iwr"><img src="/svg/lock.svg" class="i"><input type="password" id="loginPassword" placeholder="请输入密码"></div></div>
<button class="bt" id="loginBtn"><img src="/svg/enter.svg" class="iw"> 登录</button>
</div>
<script src="/api/toast.js"></script>
<script>
!function(){const $=id=>document.getElementById(id),u=$('loginUsername'),p=$('loginPassword'),btn=$('loginBtn');const api=async(url,method,body)=>{const opts={method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'include'};if(body)opts.body=JSON.stringify(body);const r=await fetch(url,opts);return await r.json()};
btn.addEventListener('click',async()=>{const un=u.value.trim(),pw=p.value.trim();if(!un||!pw){toast.error('请填写账号和密码');return}btn.disabled=true;btn.innerHTML='<img src="/svg/loading.svg" class="iw sp"> 登录中...';const r=await api('/api/login','POST',{username:un,password:pw});if(r.success){toast.success(r.message);setTimeout(()=>{window.location.href='/'},600)}else{toast.error(r.error||'登录失败');btn.disabled=false;btn.innerHTML='<img src="/svg/enter.svg" class="iw"> 登录'}});
p.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()})}();
</script>
</body>
</html>
